<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Generalization Copilot</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#ea580c; --c2:#2563eb; --c3:#16a34a; --c4:#7c3aed;
  --col-target:#b45309; --col-obs:#1d4ed8; --col-lat:#94a3b8; --col-shift:#1e293b;
  --bg:#f1f5f9; --surf:#fff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --red:#ef4444; --green:#22c55e; --amber:#f59e0b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:14px}

/* HEADER */
header{background:var(--surf);border-bottom:1px solid var(--border);padding:.75rem 1.5rem .5rem;flex-shrink:0;position:relative}
header h1{font-size:1rem;font-weight:800}
header .sub{font-size:.72rem;color:var(--muted);margin-top:1px}
.stepper{display:flex;align-items:stretch;margin-top:.85rem;overflow-x:auto}
.step-tab{display:flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;font-size:.72rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:default;transition:all .15s;user-select:none}
.step-tab .snum{width:19px;height:19px;border-radius:50%;background:#e2e8f0;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;flex-shrink:0;transition:all .15s}
.step-tab[data-s="0"].active{color:var(--c1);border-bottom-color:var(--c1)} .step-tab[data-s="0"].active .snum{background:var(--c1);color:#fff}
.step-tab[data-s="1"].active{color:var(--c2);border-bottom-color:var(--c2)} .step-tab[data-s="1"].active .snum{background:var(--c2);color:#fff}
.step-tab[data-s="2"].active{color:var(--c3);border-bottom-color:var(--c3)} .step-tab[data-s="2"].active .snum{background:var(--c3);color:#fff}
.step-tab[data-s="3"].active{color:var(--c4);border-bottom-color:var(--c4)} .step-tab[data-s="3"].active .snum{background:var(--c4);color:#fff}
.step-tab.done .snum{background:#94a3b8;color:#fff}
.step-sep{color:#cbd5e1;padding:0 .1rem;align-self:center;font-size:1.1rem;flex-shrink:0}

/* header logo */
.chai-logo{position:absolute;right:1.25rem;top:0.6rem;height:36px;width:auto;object-fit:contain}

/* MAIN */
main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:1.5rem 1.25rem 5.5rem}
main.wide{max-width:1400px}
.step-panel{display:none} .step-panel.active{display:block}

/* CARDS */
.card{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.85rem}
.sec-h{font-size:1rem;font-weight:700;margin-bottom:.2rem}
.sec-p{font-size:.78rem;color:var(--muted);line-height:1.6;margin-bottom:1rem}

/* LAYOUT */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
@media(max-width:640px){.two-col,.three-col{grid-template-columns:1fr}}

/* FORMS */
.field{margin-bottom:.65rem}
.field label{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:.28rem;letter-spacing:.03em}
input[type=text],select,textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:.38rem .6rem;font-size:.82rem;font-family:inherit;color:var(--text);background:var(--surf);outline:none;transition:border-color .15s}
input[type=text]:focus,select:focus,textarea:focus{border-color:#94a3b8;box-shadow:0 0 0 2px rgba(148,163,184,.15)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.form-row{display:flex;gap:.5rem;align-items:flex-end}
.form-row .field{flex:1;margin-bottom:0}

/* BUTTONS */
.btn{cursor:pointer;border:none;border-radius:6px;padding:.38rem .9rem;font-size:.78rem;font-weight:700;white-space:nowrap;transition:filter .15s,opacity .15s;font-family:inherit}
.btn:hover{filter:brightness(.9)} .btn:disabled{opacity:.4;cursor:default;filter:none}
.btn-dark{background:#0f172a;color:#fff}
.btn-c1{background:var(--c1);color:#fff} .btn-c2{background:var(--c2);color:#fff}
.btn-c3{background:var(--c3);color:#fff} .btn-c4{background:var(--c4);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-del{background:transparent;border:1px solid #fecaca;color:#dc2626;font-size:.68rem;padding:.18rem .5rem}
.btn-sm{padding:.22rem .65rem;font-size:.72rem}
.btn-load{background:#f1f5f9;border:1px solid var(--border);color:var(--muted);font-size:.72rem}

/* ITEM LISTS */
.item-list{display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem;min-height:2rem}
.item-row{display:flex;align-items:center;gap:.5rem;padding:.32rem .65rem;border:1px solid var(--border);border-radius:6px;font-size:.8rem;background:#f8fafc}
.item-name{flex:1;font-weight:600}
.tag{font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.tag-target{background:#fef3c7;color:#92400e}
.tag-obs{background:#dbeafe;color:#1e40af}
.tag-lat{background:#f1f5f9;color:#475569;border:1px solid var(--border)}
.tag-shift{background:#1e293b;color:#f1f5f9}
.empty-hint{text-align:center;color:var(--muted);font-size:.75rem;font-style:italic;padding:.75rem .5rem}

/* DAG */
.dag-wrap{background:#f8fafc;border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;aspect-ratio:2/1;height:auto}
.dag-wrap svg{display:block;cursor:default}
.dag-legend{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.5rem;font-size:.68rem;color:var(--muted)}
.leg-item{display:flex;align-items:center;gap:4px}
.leg-circle{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.leg-dashed{width:10px;height:10px;border-radius:50%;border:2px dashed var(--muted);flex-shrink:0}
.dag-controls{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
.dag-status{font-size:.72rem;color:var(--muted);letter-spacing:.02em;text-align:right;line-height:1.4}
.dag-status.err{color:#dc2626;font-weight:600}

/* STAGE I GRAPH BUILDER */
.builder{display:grid;grid-template-columns:300px minmax(0,1fr);gap:1rem;align-items:start}
.builder-side .card{padding:1rem}
.builder-graph{position:sticky;top:1rem;display:flex;flex-direction:column;margin-bottom:0}
.builder-graph .dag-wrap{aspect-ratio:auto;height:calc(100vh - 360px);min-height:380px}
@media(max-width:900px){.builder{grid-template-columns:1fr} .builder-graph{position:static;order:-1}}
.item-row.sel{border-color:var(--c1);background:#fff7ed}
.inline-name{flex:1;min-width:0;border-color:transparent !important;background:transparent !important;font-weight:600;padding:.15rem .35rem !important}
.inline-name:hover,.inline-name:focus{border-color:var(--border) !important;background:var(--surf) !important}
.type-sel{width:auto !important;font-size:.62rem !important;font-weight:800;text-transform:uppercase;padding:2px 4px !important;border-radius:20px !important;cursor:pointer}
.type-observed{background:#dbeafe !important;color:#1e40af;border-color:#bfdbfe !important}
.type-latent{background:#f1f5f9 !important;color:#475569}
.type-target{background:#fef3c7 !important;color:#92400e;border-color:#fde68a !important}
.type-shift{background:#1e293b !important;color:#f1f5f9;border-color:#1e293b !important}

/* BANNERS */
.banner{border-radius:7px;padding:.6rem .85rem;font-size:.75rem;line-height:1.55;margin-bottom:.85rem}
.banner-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a}
.banner-warn{background:#fffbeb;border:1px solid #fde68a;color:#78350f}
.banner-danger{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.divider{height:1px;background:var(--border);margin:.85rem 0}

/* STEP III — QUESTIONS */
.q-layout{display:flex;gap:1rem}
.q-main{flex:1.2;min-width:0}
.q-side{width:240px;flex-shrink:0}
@media(max-width:680px){.q-layout{flex-direction:column} .q-side{width:100%}}

.q-progress{display:flex;gap:4px;margin-bottom:1rem;align-items:center}
.q-dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;transition:background .2s;flex-shrink:0}
.q-dot.done{background:#86efac} .q-dot.active{background:var(--c3);box-shadow:0 0 0 2px rgba(22,163,74,.25)}

.q-card{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
.q-label{font-size:.68rem;font-weight:800;color:var(--c3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.45rem}
.q-text{font-size:.95rem;font-weight:700;line-height:1.5;margin-bottom:.3rem}
.q-hint{font-size:.75rem;color:var(--muted);line-height:1.55;margin-bottom:1rem}

.ans-opts{display:flex;flex-direction:column;gap:.4rem}
.ans-opt{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:.82rem;font-weight:500}
.ans-opt:hover{border-color:#94a3b8;background:#f8fafc}
.ans-opt.sel{border-color:var(--c3);background:#f0fdf4;color:#166534}
.ans-radio{width:16px;height:16px;border:2px solid #cbd5e1;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ans-opt.sel .ans-radio{border-color:var(--c3);background:var(--c3)}
.ans-opt.sel .ans-radio::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}

/* Stability table */
.stab-table{display:flex;flex-direction:column;gap:.35rem;margin-top:.5rem}
.stab-row{display:flex;align-items:center;gap:.6rem;padding:.45rem .7rem;border:1px solid var(--border);border-radius:7px;background:#f8fafc}
.stab-name{flex:1;font-weight:700;font-size:.83rem}
.stab-hint{font-size:.68rem;color:var(--muted);flex:1.5;line-height:1.4}
.stab-toggle{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--border);flex-shrink:0}
.stab-btn{padding:.22rem .65rem;font-size:.7rem;font-weight:700;border:none;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit;transition:all .12s}
.stab-btn.s-stable{background:#dcfce7;color:#166534}
.stab-btn.s-unstable{background:#fee2e2;color:#991b1b}

/* VERDICT */
.verdict{border-radius:10px;padding:1.25rem 1.5rem;margin-top:1rem}
.v-feasible{background:#f0fdf4;border:2px solid #86efac}
.v-infeasible{background:#fef2f2;border:2px solid #fca5a5}
.v-caveats{background:#fffbeb;border:2px solid #fcd34d}
.v-title{font-size:1.05rem;font-weight:800;margin-bottom:.45rem}
.v-feasible .v-title{color:#166534} .v-infeasible .v-title{color:#991b1b} .v-caveats .v-title{color:#854d0e}
.v-body{font-size:.82rem;line-height:1.7}
.v-body ul{padding-left:1.2rem;margin-top:.35rem}
.v-body li{margin-bottom:.25rem}

/* STRATEGY CARDS */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
@media(max-width:640px){.strat-grid{grid-template-columns:1fr}}
.strat-card{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:1rem;border-left:4px solid var(--c4)}
.strat-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.strat-name{font-size:.88rem;font-weight:700;margin-bottom:.3rem}
.strat-why{font-size:.65rem;font-weight:800;color:var(--c4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.strat-desc{font-size:.75rem;color:var(--muted);line-height:1.55}

/* SUMMARY PANEL */
.summary-section{margin-bottom:.75rem}
.summary-title{font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.summary-val{font-size:.78rem;line-height:1.5}
.summary-tag{font-size:.65rem;padding:1px 6px;border-radius:12px;background:#f1f5f9;border:1px solid var(--border);color:var(--muted);margin:1px 2px;display:inline-block}
.summary-tag.tag-sv{background:#1e293b;color:#f1f5f9;border-color:#1e293b}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--border);padding:.7rem 1.5rem;display:flex;justify-content:space-between;align-items:center;z-index:100;gap:.75rem}
.nav-center{font-size:.75rem;color:var(--muted);text-align:center;flex:1}
.nav-left,.nav-right{display:flex;gap:.5rem;align-items:center}
.err-toast{font-size:.73rem;color:#dc2626}
</style>
</head>
<body>

<header>
  <h1>Domain Generalization Copilot</h1>
  <div class="sub">A guided tool for designing predictive models robust to data shifts &mdash; based on Butler et al. (2026)</div>
  <a href="https://www.chai.ac.uk/" target="_blank" rel="noopener noreferrer">
    <img src="logo_chai.png" class="chai-logo" alt="CHAI logo">
  </a>
  <div class="stepper" id="stepper"></div>
</header>

<main>
  <div class="step-panel" id="step0"></div>
  <div class="step-panel" id="step1"></div>
  <div class="step-panel" id="step2"></div>
  <div class="step-panel" id="step3"></div>
</main>

<div class="bottom-nav">
  <div class="nav-left">
    <button class="btn btn-ghost" id="btn-back" onclick="navigate(-1)">&#8592; Back</button>
  </div>
  <div class="nav-center" id="nav-hint"></div>
  <div class="nav-right">
    <span class="err-toast" id="nav-err"></span>
    <button class="btn btn-dark" id="btn-next" onclick="navigate(1)">Next &#8594;</button>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────
let nodeSeq = 0;

const S = {
  step: 0,    // 0=ProblemConceptualization, 1=CausalDesc, 2=Feasibility, 3=Strategies
  subStep: 0, // Within step 2: 0=stability, 1..6=questions, 7=verdict

  nodes: [],      // {id,name,type:'observed'|'latent'|'target'|'shift'}
  edges: [],      // {from,to} — edges out of a shift node are shift edges

  structAssump: '',
  funcAssump: '',

  stableMap: {},  // nodeId → true|false
  answers: { canAdapt:null, privacyOk:null, sufficientData:null, computeConstr:null, canIsolate:null, canIsolateByShift:{}, canPreprocess:null },

  verdict: null,  // 'feasible'|'infeasible'|'caveats'
  nodePos: {},    // nodeId → {x,y}
  dragKey: null,
  view: {},       // svgId → {x,y,scale}
  dagOpts: {},    // svgId → last render options
  selected: null, // nodeId highlighted as the source of a new edge (Stage I editor)
  graphMsg: '',   // transient error shown in the Stage I graph toolbar
  lastClick: null,// {key,t} for double-click detection
  mousePt: null,  // cursor in graph coordinates, for the pending-edge line
};

const isShift = n => n.type === 'shift';
function varNodes() { return S.nodes.filter(n => !isShift(n)); }
function shiftVars() {
  return S.nodes.filter(isShift).map(n => ({ id: n.id, name: n.name, affects: S.edges.filter(e => e.from === n.id).map(e => e.to) }));
}

// ─────────────────────────────────────────────────────────────────────
// GRAPH OPERATIONS
// ─────────────────────────────────────────────────────────────────────
function nameTaken(name, exceptId) {
  return S.nodes.some(n => n.id !== exceptId && n.name.toLowerCase() === name.toLowerCase());
}

function genericName() {
  let i = 1;
  while (nameTaken('X' + i)) i++;
  return 'X' + i;
}

// pos: optional {x,y} in graph coordinates; otherwise a free spot near the view centre
function addNode(name, type, pos) {
  name = name.trim();
  if (!name) return 'Node name is required.';
  if (nameTaken(name)) return 'A node with this name already exists.';
  if (type === 'target') S.nodes.forEach(n => { if (n.type === 'target') n.type = 'observed'; });
  const id = ++nodeSeq;
  S.nodes.push({ id, name, type });
  if (!isShift({ type })) S.stableMap[id] = null;
  S.nodePos[id] = pos || findFreeSpot(viewCentre('dag0'));
  renderAll();
  return null;
}

function removeNode(id) {
  S.nodes = S.nodes.filter(n => n.id !== id);
  S.edges = S.edges.filter(e => e.from !== id && e.to !== id);
  delete S.stableMap[id];
  delete S.nodePos[id];
  delete S.answers.canIsolateByShift[id];
  if (S.selected === id) S.selected = null;
  renderAll();
}

function renameNode(id, name) {
  const nd = S.nodes.find(n => n.id === id);
  if (!nd) return null;
  name = name.trim();
  let err = null;
  if (!name) err = 'Node name is required.';
  else if (nameTaken(name, id)) err = 'A node with this name already exists.';
  else nd.name = name;
  renderAll();
  return err;
}

function setNodeType(id, type) {
  const nd = S.nodes.find(n => n.id === id);
  if (!nd || nd.type === type) return null;
  if (type === 'shift' && S.edges.some(e => e.to === id)) {
    renderAll();
    return 'Shift variables cannot have incoming edges — remove them first.';
  }
  if (type === 'target') S.nodes.forEach(n => { if (n.type === 'target') n.type = 'observed'; });
  if (type === 'shift') { delete S.stableMap[id]; }
  else if (isShift(nd)) { S.stableMap[id] = null; delete S.answers.canIsolateByShift[id]; }
  nd.type = type;
  renderAll();
  return null;
}

function addEdge(fromId, toId) {
  if (fromId === toId) return 'Source and target must be different.';
  if (isShift(S.nodes.find(n => n.id === toId) || {})) return 'Shift variables cannot have incoming edges.';
  if (S.edges.some(e => e.from === fromId && e.to === toId)) return 'This edge already exists.';
  if (pathExists(toId, fromId)) return 'This edge would create a cycle.';
  S.edges.push({ from: fromId, to: toId });
  renderAll();
  return null;
}

function removeEdge(from, to) {
  S.edges = S.edges.filter(e => !(e.from === from && e.to === to));
  renderAll();
}

function pathExists(start, end) {
  const vis = new Set(), q = [start];
  while (q.length) {
    const cur = q.shift();
    if (cur === end) return true;
    if (vis.has(cur)) continue;
    vis.add(cur);
    S.edges.forEach(e => { if (e.from === cur) q.push(e.to); });
  }
  return false;
}

// ─────────────────────────────────────────────────────────────────────
// LAYOUT
// ─────────────────────────────────────────────────────────────────────
function viewCentre(svgId) {
  const vb = document.getElementById(svgId)?.viewBox.baseVal;
  if (vb && vb.width) return { x: vb.x + vb.width / 2, y: vb.y + vb.height / 2 };
  return { x: 0, y: 0 };
}

function findFreeSpot(c) {
  const taken = Object.values(S.nodePos), MIN = 70;
  for (let r = 0; r < 600; r += 35) {
    const steps = r === 0 ? 1 : Math.ceil((2 * Math.PI * r) / 35);
    for (let k = 0; k < steps; k++) {
      const p = { x: c.x + r * Math.cos((2 * Math.PI * k) / steps), y: c.y + r * Math.sin((2 * Math.PI * k) / steps) };
      if (taken.every(q => Math.hypot(q.x - p.x, q.y - p.y) >= MIN)) return p;
    }
  }
  return { ...c };
}

// Layered (Sugiyama-style) layout in graph coordinates. Only nodes without a stored
// position are placed, so manual arrangements survive; Auto-layout clears them all.
const LAYER_GAP = 150, SLOT_GAP = 100;

function computeLayout() {
  const pos = {};
  if (S.nodes.length === 0) return pos;
  if (S.nodes.every(n => S.nodePos[n.id])) {
    S.nodes.forEach(n => pos[n.id] = S.nodePos[n.id]);
    return pos;
  }

  // 1. Longest-path layering of the ordinary variables
  const vars = varNodes();
  const layerOf = {}, preds = {};
  vars.forEach(n => preds[n.id] = []);
  const varEdges = S.edges.filter(e => preds[e.from] !== undefined && preds[e.to] !== undefined);
  varEdges.forEach(e => preds[e.to].push(e.from));
  const depth = id => layerOf[id] ?? (layerOf[id] = preds[id].length ? 1 + Math.max(...preds[id].map(depth)) : 0);
  vars.forEach(n => depth(n.id));
  const nL = vars.length ? Math.max(...vars.map(n => layerOf[n.id])) + 1 : 0;

  // 2. Split edges that skip layers into chains of dummy slots, so that intermediate
  //    layers reserve room for the edge instead of placing a node on top of it
  const layers = Array.from({ length: nL }, () => []);
  vars.forEach(n => layers[layerOf[n.id]].push(n.id));
  const up = {}, down = {};
  const link = (a, b) => { (down[a] = down[a] || []).push(b); (up[b] = up[b] || []).push(a); };
  let dummySeq = 0;
  varEdges.forEach(e => {
    let prev = e.from;
    for (let l = layerOf[e.from] + 1; l < layerOf[e.to]; l++) {
      const d = 'd' + dummySeq++;
      layers[l].push(d);
      link(prev, d);
      prev = d;
    }
    link(prev, e.to);
  });

  // 3. Barycentre sweeps to reduce crossings
  const idx = {};
  const reindex = layer => layer.forEach((k, i) => idx[k] = i);
  layers.forEach(reindex);
  const bary = (k, nbrs) => nbrs && nbrs.length ? nbrs.reduce((a, b) => a + idx[b], 0) / nbrs.length : idx[k];
  for (let it = 0; it < 8; it++) {
    const downward = it % 2 === 0;
    const order = downward ? layers.map((_, i) => i) : layers.map((_, i) => nL - 1 - i);
    order.forEach(l => {
      const nb = downward ? up : down;
      const bc = Object.fromEntries(layers[l].map(k => [k, bary(k, nb[k])]));
      layers[l].sort((a, b) => bc[a] - bc[b]);
      reindex(layers[l]);
    });
  }

  // 4. Vertical coordinates: pull each slot towards its neighbours, keeping the
  //    layer order and a minimum gap between slots
  const y = {};
  layers.forEach(layer => layer.forEach((k, i) => y[k] = (i - (layer.length - 1) / 2) * SLOT_GAP));
  for (let it = 0; it < 6; it++) {
    layers.forEach(layer => {
      const want = layer.map(k => {
        const nb = [...(up[k] || []), ...(down[k] || [])];
        return nb.length ? nb.reduce((a, b) => a + y[b], 0) / nb.length : y[k];
      });
      const got = [...want];
      for (let i = 1; i < got.length; i++) got[i] = Math.max(got[i], got[i - 1] + SLOT_GAP);
      const shift = want.reduce((a, b) => a + b, 0) / want.length - got.reduce((a, b) => a + b, 0) / got.length;
      layer.forEach((k, i) => y[k] = got[i] + shift);
    });
  }
  const auto = {};
  vars.forEach(n => auto[n.id] = { x: layerOf[n.id] * LAYER_GAP, y: y[n.id] });

  // 5. Shift variables sit above the nodes they affect, nudged sideways if the spot is taken
  const near = (p, list) => list.some(q => Math.hypot(q.x - p.x, q.y - p.y) < 70);
  shiftVars().forEach(sv => {
    const kids = sv.affects.map(id => S.nodePos[id] || auto[id]).filter(Boolean);
    const all = Object.values(auto);
    const top = all.length ? Math.min(...all.map(p => p.y)) : 0;
    const base = kids.length
      ? { x: kids.reduce((a, p) => a + p.x, 0) / kids.length, y: Math.min(...kids.map(p => p.y)) - SLOT_GAP }
      : { x: -LAYER_GAP, y: top };
    let p = base;
    for (let k = 1; near(p, Object.values(auto)) && k < 20; k++) {
      p = { x: base.x + Math.ceil(k / 2) * (k % 2 ? 1 : -1) * LAYER_GAP / 2, y: base.y - (k > 8 ? SLOT_GAP : 0) };
    }
    auto[sv.id] = p;
  });

  S.nodes.forEach(n => {
    if (!S.nodePos[n.id]) S.nodePos[n.id] = auto[n.id] || findFreeSpot({ x: 0, y: 0 });
    pos[n.id] = S.nodePos[n.id];
  });
  return pos;
}

// Route an edge as a straight line, or as a quadratic curve if the straight line would
// pass through (or graze) another node. `bends` holds the bend directions of curves already
// routed at either endpoint, so sibling curves bow to opposite sides instead of overlapping.
// Returns { d: SVG path data, c: control point, bend: unit vector or null, pts: samples }.
function edgeRoute(s, d, startOff, endOff, obstacles, clearance, bends = []) {
  const dx = d.x - s.x, dy = d.y - s.y, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const sample = (cx, cy) => Array.from({ length: 23 }, (_, k) => {
    const t = (k + 1) / 24, a = (1 - t) * (1 - t), b = 2 * t * (1 - t), c = t * t;
    return { x: a * s.x + b * cx + c * d.x, y: a * s.y + b * cy + c * d.y };
  });
  const hits = (cx, cy, cl = clearance) => sample(cx, cy).some(p => obstacles.some(o => Math.hypot(o.x - p.x, o.y - p.y) < cl));
  const mx = (s.x + d.x) / 2, my = (s.y + d.y) / 2;
  let cx = mx, cy = my, bend = null;
  if (hits(cx, cy)) {
    const blocker = obstacles.reduce((best, o) => {
      const dist = Math.abs((o.x - s.x) * nx + (o.y - s.y) * ny);
      return !best || dist < best.dist ? { o, dist } : best;
    }, null).o;
    const away = (blocker.x - s.x) * nx + (blocker.y - s.y) * ny > 0 ? -1 : 1;
    const crowd = sg => bends.reduce((m, v) => Math.max(m, v.x * nx * sg + v.y * ny * sg), -1);
    const sides = [away, -away].sort((p, q) => crowd(p) - crowd(q));
    let sgn = sides[0], mag = 80;
    // once bent, keep enough distance to clear the obstacles' labels too
    search: for (const m of [50, 80, 110, 140, 180, 230]) {
      for (const sg of sides) if (!hits(mx + nx * m * sg, my + ny * m * sg, clearance + 16)) { sgn = sg; mag = m; break search; }
    }
    // siblings on the same side get a wider arc so they don't sit on top of each other
    if (crowd(sgn) > 0.5) mag += 35;
    cx = mx + nx * mag * sgn; cy = my + ny * mag * sgn;
    bend = { x: nx * sgn, y: ny * sgn };
  }
  const u1 = Math.hypot(cx - s.x, cy - s.y) || 1, u2 = Math.hypot(d.x - cx, d.y - cy) || 1;
  const x1 = s.x + (cx - s.x) / u1 * startOff, y1 = s.y + (cy - s.y) / u1 * startOff;
  const x2 = d.x - (d.x - cx) / u2 * endOff, y2 = d.y - (d.y - cy) / u2 * endOff;
  return {
    d: bend ? `M${x1},${y1}Q${cx},${cy} ${x2},${y2}` : `M${x1},${y1}L${x2},${y2}`,
    c: { x: cx, y: cy }, bend, pts: sample(cx, cy),
  };
}

// ─────────────────────────────────────────────────────────────────────
// SVG
// ─────────────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function se(tag, a) {
  const el = document.createElementNS(NS, tag);
  if (a) Object.entries(a).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function svgPoint(svg, ev) {
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  return {
    x: (vb.x || 0) + (ev.clientX - r.left) * ((vb.width || r.width) / r.width),
    y: (vb.y || 0) + (ev.clientY - r.top) * ((vb.height || r.height) / r.height),
  };
}

// Re-render with the options the graph was last drawn with (used by drag/pan/zoom)
function rerenderDAG(svgId) { renderDAG(svgId, S.dagOpts[svgId] || {}); }

function renderDAG(svgId, opts = {}) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  S.dagOpts[svgId] = { ...opts, resetView: false };
  const wrap = svg.parentElement;
  const W = wrap.clientWidth || 460;
  const H = wrap.clientHeight || 260;
  svg.style.width = '100%';
  svg.style.height = '100%';
  svg.innerHTML = '';

  const { stableMap = {}, draggable = false, editable = false, resetView = false } = opts;
  const NR = 16, SQ = 14;

  if (!svg.__graphAttached) {
    svg.addEventListener('mousedown', ev => onSvgMouseDown(ev, svgId));
    svg.addEventListener('mousemove', ev => onSvgMouseMove(ev, svgId));
    svg.addEventListener('wheel', ev => onSvgWheel(ev, svgId), { passive: false });
    svg.__graphAttached = true;
  }

  const pos = computeLayout();
  if (!S.view[svgId] || resetView) setHomeView(svgId, pos, W, H);
  const view = S.view[svgId];
  const vbW = W / view.scale;
  const vbH = H / view.scale;
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${vbW} ${vbH}`);
  if (editable) updateGraphStatus(svgId);

  if (S.nodes.length === 0) {
    const t = se('text', { x: view.x + vbW / 2, y: view.y + vbH / 2, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: '#94a3b8', 'font-size': '12', 'font-style': 'italic', 'pointer-events': 'none' });
    t.textContent = editable ? 'Double-click anywhere to add a node' : 'Add nodes to preview the graph';
    svg.appendChild(t);
    return;
  }

  // Markers
  const defs = se('defs');
  [['arr', '#94a3b8'], ['sarr', '#475569'], ['parr', '#ea580c']].forEach(([id, fill]) => {
    const m = se('marker', { id: svgId + id, viewBox: '0 -5 10 10', refX: 8, refY: 0, markerWidth: 5, markerHeight: 5, orient: 'auto' });
    m.appendChild(se('path', { d: 'M0,-5L10,0L0,5', fill }));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  // Edges (dashed when they leave a shift variable)
  const byId = Object.fromEntries(S.nodes.map(n => [n.id, n]));
  const routes = [], bends = {};
  S.edges.forEach(e => {
    const s = pos[e.from], d = pos[e.to];
    if (!s || !d) return;
    const shift = isShift(byId[e.from] || {});
    const obstacles = S.nodes.filter(n => n.id !== e.from && n.id !== e.to).map(n => pos[n.id]).filter(Boolean);
    const route = edgeRoute(s, d, shift ? SQ + 3 : NR + 2, NR + 7, obstacles, NR + 8, [...(bends[e.from] || []), ...(bends[e.to] || [])]);
    if (route.bend) [e.from, e.to].forEach(id => (bends[id] = bends[id] || []).push(route.bend));
    routes.push({ e, route });
    const path = se('path', {
      d: route.d,
      fill: 'none', stroke: shift ? '#475569' : '#94a3b8', 'stroke-width': 1.5,
      'marker-end': `url(#${svgId}${shift ? 'sarr' : 'arr'})`, opacity: shift ? .85 : .75,
    });
    if (shift) path.setAttribute('stroke-dasharray', '6,3');
    svg.appendChild(path);
  });

  // Rubber-band edge from the selected node to the cursor
  const selPos = editable && S.selected !== null ? pos[S.selected] : null;
  if (selPos) {
    const m = S.mousePt || selPos;
    svg.appendChild(se('line', {
      id: svgId + '-pending', x1: selPos.x, y1: selPos.y, x2: m.x, y2: m.y,
      stroke: '#ea580c', 'stroke-width': 2, 'stroke-dasharray': '4,4',
      'marker-end': `url(#${svgId}parr)`, 'pointer-events': 'none',
    }));
  }

  // Nodes
  S.nodes.forEach(nd => {
    const p = pos[nd.id];
    if (!p) return;
    const g = se('g', { transform: `translate(${p.x},${p.y})` });
    const selected = editable && S.selected === nd.id;

    if (isShift(nd)) {
      if (selected) g.appendChild(se('rect', { x: -SQ - 6, y: -SQ - 6, width: (SQ + 6) * 2, height: (SQ + 6) * 2, rx: 6, fill: 'none', stroke: '#ea580c', 'stroke-width': 3 }));
      g.appendChild(se('rect', { x: -SQ, y: -SQ, width: SQ * 2, height: SQ * 2, fill: '#1e293b', rx: 3, stroke: '#fff', 'stroke-width': 1.5 }));
    } else {
      const stable = stableMap[nd.id];
      if (selected) g.appendChild(se('circle', { r: NR + 7, fill: 'none', stroke: '#ea580c', 'stroke-width': 3 }));
      else if (stable === true) g.appendChild(se('circle', { r: NR + 5, fill: 'none', stroke: '#4ade80', 'stroke-width': 2, opacity: .85 }));
      else if (stable === false) g.appendChild(se('circle', { r: NR + 5, fill: 'none', stroke: '#f87171', 'stroke-width': 2.5, 'stroke-dasharray': '4,3', opacity: .9 }));

      let fill, stroke, dash = '';
      if (nd.type === 'target') { fill = '#b45309'; stroke = '#fff'; }
      else if (nd.type === 'latent') { fill = '#f8fafc'; stroke = '#94a3b8'; dash = '5,3'; }
      else { fill = '#1d4ed8'; stroke = '#fff'; }
      const c = se('circle', { r: NR, fill, stroke, 'stroke-width': 1.5 });
      if (dash) c.setAttribute('stroke-dasharray', dash);
      g.appendChild(c);
    }

    // Label sits outside the node on the side with the fewest edges, with a halo so it
    // stays legible if an edge does pass behind it
    const r = isShift(nd) ? SQ : NR;
    const side = labelSide(nd.id, pos, routes);
    const lbl = se('text', {
      x: side.x * (r + 6), y: side.y ? side.y * (r + 12) : 0,
      'text-anchor': side.x > 0 ? 'start' : side.x < 0 ? 'end' : 'middle', 'dominant-baseline': 'central',
      'font-size': '11', 'font-weight': '700', fill: '#0f172a',
      stroke: '#f8fafc', 'stroke-width': 3, 'stroke-linejoin': 'round', 'paint-order': 'stroke',
    });
    lbl.textContent = nd.name.length > 20 ? nd.name.slice(0, 19) + '…' : nd.name;
    const tt = se('title'); tt.textContent = nd.name + ({ latent: ' (latent)', target: ' (prediction target)', shift: ' (shift variable)' }[nd.type] || '');
    g.appendChild(tt); g.appendChild(lbl);

    if (draggable) { g.style.cursor = 'grab'; g.addEventListener('mousedown', ev => startDrag(ev, nd.id, svgId)); }
    svg.appendChild(g);
  });
}

// Pick below / above / right / left for a node's label: whichever points furthest away from
// the node's own edges and from any other edge passing close by (ties go to "below").
const LABEL_SIDES = [{ x: 0, y: 1 }, { x: 0, y: -1 }, { x: 1, y: 0 }, { x: -1, y: 0 }];
function labelSide(id, pos, routes) {
  const p = pos[id];
  const unit = q => { const l = Math.hypot(q.x - p.x, q.y - p.y) || 1; return { x: (q.x - p.x) / l, y: (q.y - p.y) / l }; };
  const dirs = [];
  routes.forEach(({ e, route }) => {
    if (e.from === id || e.to === id) dirs.push(unit(route.bend ? route.c : pos[e.from === id ? e.to : e.from]));
    else route.pts.forEach(q => { if (Math.hypot(q.x - p.x, q.y - p.y) < 50) dirs.push(unit(q)); });
  });
  if (!dirs.length) return LABEL_SIDES[0];
  let best = LABEL_SIDES[0], bestScore = Infinity;
  LABEL_SIDES.forEach((sd, i) => {
    // horizontal labels are wide, so they need more angular room than vertical ones
    const clash = Math.max(...dirs.map(d => sd.x * d.x + sd.y * d.y)) + (sd.x ? 0.35 : 0) + i * 0.01;
    if (clash < bestScore) { bestScore = clash; best = sd; }
  });
  return best;
}

// Mouse handling uses a small movement threshold so a click is never mistaken for a drag
// (a drag re-renders the SVG, which would otherwise swallow click / double-click detection).
const DRAG_THRESHOLD = 4;

function startDrag(ev, key, svgId) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  const svg = document.getElementById(svgId);
  if (!svg) return;
  S.dragKey = key;
  const m0 = svgPoint(svg, ev);
  const cur = S.nodePos[key] || m0;
  const off = { dx: m0.x - cur.x, dy: m0.y - cur.y };
  const sx = ev.clientX, sy = ev.clientY;
  let moved = false;

  const onMove = e => {
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < DRAG_THRESHOLD) return;
    moved = true;
    const m = svgPoint(svg, e);
    S.nodePos[key] = { x: m.x - off.dx, y: m.y - off.dy };
    rerenderDAG(svgId);
  };
  const onUp = () => {
    S.dragKey = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (!moved && S.dagOpts[svgId]?.editable) onNodeClick(key, svgId);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function setHomeView(svgId, pos, W, H) {
  const view = { x: -W / 2, y: -H / 2, scale: 1 };
  const points = Object.values(pos);
  if (points.length > 0) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    points.forEach(p => {
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    });
    const pad = 70;
    const width = Math.max(1, maxX - minX + pad * 2);
    const height = Math.max(1, maxY - minY + pad * 2);
    const scale = Math.min(1.25,Math.max(0.25, Math.min(W / width, H / height)));
    // centre the bounding box in the viewport
    view.x = (minX + maxX) / 2 - W / scale / 2;
    view.y = (minY + maxY) / 2 - H / scale / 2;
    view.scale = scale;
  }
  S.view[svgId] = view;
}

function onSvgMouseDown(ev, svgId) {
  if (ev.button !== 0 || S.dragKey) return;
  if (ev.target.closest('g')) return;
  const svg = document.getElementById(svgId);
  if (!svg) return;
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const clickPt = svgPoint(svg, ev);
  const source = {
    startX: ev.clientX,
    startY: ev.clientY,
    origX: S.view[svgId]?.x ?? 0,
    origY: S.view[svgId]?.y ?? 0,
    vbW: vb.width || r.width,
    vbH: vb.height || r.height,
    rW: r.width,
    rH: r.height,
  };
  let moved = false;

  const onMove = e => {
    if (!moved && Math.hypot(e.clientX - source.startX, e.clientY - source.startY) < DRAG_THRESHOLD) return;
    moved = true;
    const dx = (e.clientX - source.startX) * (source.vbW / source.rW);
    const dy = (e.clientY - source.startY) * (source.vbH / source.rH);
    S.view[svgId].x = source.origX - dx;
    S.view[svgId].y = source.origY - dy;
    rerenderDAG(svgId);
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (!moved && S.dagOpts[svgId]?.editable) onBackgroundClick(clickPt, svgId);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function onSvgMouseMove(ev, svgId) {
  if (S.selected === null || !S.dagOpts[svgId]?.editable) return;
  const svg = document.getElementById(svgId);
  if (!svg) return;
  S.mousePt = svgPoint(svg, ev);
  const ln = document.getElementById(svgId + '-pending');
  if (ln) { ln.setAttribute('x2', S.mousePt.x); ln.setAttribute('y2', S.mousePt.y); }
}

function onSvgWheel(ev, svgId) {
  ev.preventDefault();
  const svg = document.getElementById(svgId);
  if (!svg) return;
  const view = S.view[svgId] || { x: 0, y: 0, scale: 1 };
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const factor = ev.deltaY > 0 ? 0.88 : 1.12;
  const newScale = Math.max(0.25, Math.min(3, view.scale * factor));
  if (Math.abs(newScale - view.scale) < 0.0001) return;
  const x = ev.clientX - r.left;
  const y = ev.clientY - r.top;
  const viewX = view.x + x * (vb.width / r.width);
  const viewY = view.y + y * (vb.height / r.height);
  const newVbW = vb.width * (view.scale / newScale);
  const newVbH = vb.height * (view.scale / newScale);
  S.view[svgId] = {
    x: viewX - x * (newVbW / r.width),
    y: viewY - y * (newVbH / r.height),
    scale: newScale,
  };
  rerenderDAG(svgId);
}

function resetGraphView(svgId) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  S.view[svgId] = null;
  renderDAG(svgId, { ...S.dagOpts[svgId], resetView: true });
}

function autoLayout(svgId) {
  S.nodePos = {};
  resetGraphView(svgId);
}

// ─────────────────────────────────────────────────────────────────────
// STAGE I GRAPH EDITOR
// ─────────────────────────────────────────────────────────────────────
function isDoubleClick(key) {
  const now = Date.now(), last = S.lastClick;
  const dbl = !!last && last.key === key && now - last.t < 400;
  S.lastClick = dbl ? null : { key, t: now };
  return dbl;
}

function onNodeClick(id, svgId) {
  S.graphMsg = '';
  if (isDoubleClick(id)) {
    S.selected = S.selected === id ? null : id;
    S.mousePt = null;
    syncSelection(svgId);
    return;
  }
  if (S.selected !== null && S.selected !== id) {
    const from = S.selected;
    S.selected = null;
    const err = addEdge(from, id);
    if (err) { S.graphMsg = err; syncSelection(svgId); }
  }
}

function onBackgroundClick(pt, svgId) {
  S.graphMsg = '';
  if (isDoubleClick('bg')) { S.selected = null; addNode(genericName(), 'observed', pt); return; }
  if (S.selected !== null) S.selected = null;
  syncSelection(svgId);
}

// Redraw the graph and the highlighted row in the node list without rebuilding the panel
function syncSelection(svgId) {
  document.querySelectorAll('#node-list .item-row').forEach(r => r.classList.toggle('sel', +r.dataset.id === S.selected));
  rerenderDAG(svgId);
}

function updateGraphStatus(svgId) {
  const el = document.getElementById(svgId + '-status');
  if (!el) return;
  const sel = S.nodes.find(n => n.id === S.selected);
  el.classList.toggle('err', !!S.graphMsg);
  if (S.graphMsg) el.textContent = S.graphMsg;
  else if (sel) el.innerHTML = `Drawing edge from <strong>${escHtml(sel.name)}</strong> — click a target node &bull; Esc to cancel &bull; Del to delete node`;
  else el.innerHTML = GRAPH_HELP.editable;
}

const GRAPH_HELP = {
  editable: 'Double-click space: new node &bull; double-click a node, then click another: new edge &bull; drag to move / pan &bull; scroll to zoom',
  view: 'Scroll to zoom &bull; drag empty space to pan &bull; drag nodes to move',
};

function graphControlBar(svgId, editable = false) {
  return `<div class="dag-controls">
    <div style="display:flex;gap:.4rem;flex-shrink:0">
      <button class="btn btn-sm btn-ghost" type="button" onclick="resetGraphView('${svgId}')">Reset View</button>
      ${editable ? `<button class="btn btn-sm btn-ghost" type="button" onclick="autoLayout('${svgId}')" title="Re-arrange all nodes automatically">Auto-layout</button>
      <button class="btn btn-sm btn-load" type="button" onclick="loadExample()" title="Replace the current graph with the lung cancer screening example">Load Example</button>` : ''}
    </div>
    <div class="dag-status" id="${svgId}-status">${editable ? GRAPH_HELP.editable : GRAPH_HELP.view}</div>
  </div>`;
}

document.addEventListener('keydown', ev => {
  if (S.step !== 0 || S.selected === null) return;
  if (ev.target.closest && ev.target.closest('input,select,textarea')) return;
  if (ev.key === 'Escape') { S.selected = null; S.graphMsg = ''; syncSelection('dag0'); }
  else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); removeNode(S.selected); }
});

// ─────────────────────────────────────────────────────────────────────
// STEP RENDERERS
// ─────────────────────────────────────────────────────────────────────

const NODE_TYPES = [
  ['observed', 'Observed', 'Observed'],
  ['latent', 'Latent (unobserved)', 'Latent'],
  ['target', 'Prediction Target', 'Target'],
  ['shift', 'Shift Variable', 'Shift'],
];

function graphLegend() {
  return `<div class="dag-legend">
    <div class="leg-item"><span class="leg-circle" style="background:var(--col-target)"></span>Prediction target</div>
    <div class="leg-item"><span class="leg-circle" style="background:var(--col-obs)"></span>Observed</div>
    <div class="leg-item"><span class="leg-dashed"></span>Latent</div>
    <div class="leg-item"><span class="leg-sq" style="background:var(--col-shift)"></span>Shift variable</div>
  </div>`;
}

function renderStep0() {
  const p = document.getElementById('step0');
  const typeOptions = (sel, short) => NODE_TYPES.map(([v, long, sh]) => `<option value="${v}" ${v === sel ? 'selected' : ''}>${short ? sh : long}</option>`).join('');
  const nodeOptions = list => list.map(n => `<option value="${n.id}">${escHtml(n.name)}</option>`).join('');

  p.innerHTML = `
<h2 class="sec-h">I. Problem Conceptualization</h2>
<p class="sec-p">Build the causal graph of your prediction problem: the variables in your system, the target you want to predict, and the <strong>shift variables</strong> (squares) that index the environments where your model will be deployed. An edge S → X from a shift variable means the mechanism generating X can vary across environments.</p>
<div class="builder">
  <div class="builder-side">
    <div class="card">
      <div class="card-title">Add Node</div>
      <div class="field"><label>Name</label><input type="text" id="i-nname" placeholder="e.g. Age, Hospital, Outcome" onkeydown="if(event.key==='Enter')doAddNode()"></div>
      <div class="field"><label>Type</label><select id="i-ntype">${typeOptions('observed')}</select></div>
      <div id="node-err" class="err-toast"></div>
      <button class="btn btn-c1 btn-sm" onclick="doAddNode()">+ Add Node</button>

      <div class="divider"></div>
      <div class="card-title">Nodes${S.nodes.length ? ` (${S.nodes.length})` : ''}</div>
      <div class="item-list" id="node-list">
        ${S.nodes.length === 0 ? '<div class="empty-hint">No nodes yet — add one here or double-click the graph</div>' :
          S.nodes.map(n => `
          <div class="item-row ${S.selected === n.id ? 'sel' : ''}" data-id="${n.id}">
            <input type="text" class="inline-name" value="${escHtml(n.name)}" title="Rename" onchange="doRenameNode(${n.id},this.value)" onkeydown="if(event.key==='Enter')this.blur()">
            <select class="type-sel type-${n.type}" title="Change type" onchange="doSetNodeType(${n.id},this.value)">${typeOptions(n.type, true)}</select>
            <button class="btn btn-del" onclick="removeNode(${n.id})">✕</button>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Add Edge</div>
      <div class="form-row">
        <div class="field"><label>From</label><select id="i-efrom">${nodeOptions(S.nodes)}</select></div>
        <div style="align-self:flex-end;padding-bottom:.38rem;color:var(--muted);font-weight:700;font-size:1.1rem">→</div>
        <div class="field"><label>To</label><select id="i-eto">${nodeOptions(varNodes())}</select></div>
      </div>
      <div id="edge-err" class="err-toast"></div>
      <button class="btn btn-c1 btn-sm" style="margin-top:.5rem" onclick="doAddEdge()">+ Add Edge</button>

      <div class="divider"></div>
      <div class="card-title">Edges${S.edges.length ? ` (${S.edges.length})` : ''}</div>
      <div class="item-list" id="edge-list">
        ${S.edges.length === 0 ? '<div class="empty-hint">No edges yet</div>' :
          S.edges.map(e => {
            const fn = S.nodes.find(n => n.id === e.from), tn = S.nodes.find(n => n.id === e.to);
            const shift = fn && isShift(fn);
            return `<div class="item-row">
              <span class="item-name">${fn ? escHtml(fn.name) : '?'} ${shift ? '⇢' : '→'} ${tn ? escHtml(tn.name) : '?'}</span>
              ${shift ? '<span class="tag tag-shift">Shift</span>' : ''}
              <button class="btn btn-del" onclick="removeEdge(${e.from},${e.to})">✕</button>
            </div>`;
          }).join('')}
      </div>
    </div>
  </div>

  <div class="card builder-graph">
    <div class="card-title">Causal Graph</div>
    ${graphControlBar('dag0', true)}
    <div class="dag-wrap"><svg id="dag0"></svg></div>
    ${graphLegend()}
  </div>
</div>`;

  requestAnimationFrame(() => renderDAG('dag0', { draggable: true, editable: true }));
}

function renderStep1() {
  const p = document.getElementById('step1');

  p.innerHTML = `
<h2 class="sec-h">II. Causal Description</h2>
<p class="sec-p">Encode your causal knowledge beyond the graph. Record any structural assumptions about the causal mechanisms, and functional assumptions about how the shift variables act on them.</p>

<div class="two-col">
  <div>
    <div class="card">
      <div class="card-title">Causal Assumptions (optional)</div>
      <div class="field">
        <label>Structural Assumptions</label>
        <textarea id="i-struct" placeholder="E.g.: Blood pressure depends linearly on dosage. The target Y is determined by X₁ and X₂ through a logistic function.">${escHtml(S.structAssump)}</textarea>
      </div>
      <div class="field">
        <label>Functional Assumptions about Shifts</label>
        <textarea id="i-func" placeholder="E.g.: The shift in scanner noise is additive with constant mean and varying variance. The prevalence shift affects only P(Y), not P(X|Y).">${escHtml(S.funcAssump)}</textarea>
      </div>
    </div>
  </div>

  <div>
    <div class="card" style="height:100%;display:flex;flex-direction:column">
      <div class="card-title">Causal Graph</div>
      ${S.nodes.some(isShift) ? '' : '<div class="banner banner-warn" style="font-size:.72rem;margin-bottom:.65rem">No shift variables defined. Go back to Step I to add them as nodes of type “Shift Variable”.</div>'}
      ${graphControlBar('dag1')}
      <div class="dag-wrap" style="flex:1">
        <svg id="dag1"></svg>
      </div>
      ${graphLegend()}
    </div>
  </div>
</div>`;

  p.querySelector('#i-struct').addEventListener('input', e => S.structAssump = e.target.value);
  p.querySelector('#i-func').addEventListener('input', e => S.funcAssump = e.target.value);

  requestAnimationFrame(() => renderDAG('dag1', { draggable: true }));
}

function renderStep2() {
  const p = document.getElementById('step2');
  const covariates = S.nodes.filter(n => n.type !== 'target' && n.type !== 'latent');
  const target = S.nodes.find(n => n.type === 'target');
  const totalQs = 7; // stability + 6 questions

  p.innerHTML = `
<h2 class="sec-h">III. Feasibility Analysis</h2>
<p class="sec-p" style="margin-bottom:.75rem">Answer the questions below to determine whether a robust predictive model is feasible for your problem. Your answers will guide which deployment strategies are applicable.</p>
<div class="q-layout">
  <div class="q-main" id="q-main-area"></div>
  <div class="q-side" id="q-side-area"></div>
</div>`;

  renderQ3Side();
  renderQ3Main();
}

function renderQ3Side() {
  const side = document.getElementById('q-side-area');
  if (!side) return;
  const target = S.nodes.find(n => n.type === 'target');
  const stableCount = Object.values(S.stableMap).filter(v => v === true).length;
  const unstableCount = Object.values(S.stableMap).filter(v => v === false).length;

  side.innerHTML = `
    <div class="card" style="margin-bottom:.75rem">
      <div class="card-title">Graph</div>
      ${graphControlBar('dag2')}
      <div class="dag-wrap">
        <svg id="dag2" data-h="195"></svg>
      </div>
      <div class="dag-legend" style="margin-top:.4rem">
        <div class="leg-item"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid #4ade80;flex-shrink:0"></span>Stable</div>
        <div class="leg-item"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;border:2.5px dashed #f87171;flex-shrink:0"></span>Unstable</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Summary</div>
      <div class="summary-section">
        <div class="summary-title">Target</div>
        <div class="summary-val">${target ? `<span class="tag tag-target">${escHtml(target.name)}</span>` : '<em style="color:var(--muted)">Not specified</em>'}</div>
      </div>
      <div class="summary-section">
        <div class="summary-title">Shift Variables</div>
        <div class="summary-val">${shiftVars().length === 0 ? '<em style="color:var(--muted)">None specified</em>' : shiftVars().map(sv => `<span class="summary-tag tag-sv">${escHtml(sv.name)}</span>`).join('')}</div>
      </div>
      ${S.subStep >= 0 ? `
      <div class="summary-section">
        <div class="summary-title">Stability</div>
        <div class="summary-val" style="font-size:.78rem">
          ${stableCount > 0 ? `<span style="color:#166534">✓ ${stableCount} stable</span>` : ''}
          ${unstableCount > 0 ? `<span style="color:#991b1b;${stableCount>0?'margin-left:.5rem':''}">⚠ ${unstableCount} unstable</span>` : ''}
          ${stableCount === 0 && unstableCount === 0 ? '<em style="color:var(--muted)">Not assessed yet</em>' : ''}
        </div>
      </div>` : ''}
    </div>`;

  requestAnimationFrame(() => renderDAG('dag2', { stableMap: S.stableMap, draggable: true }));
}

function renderQ3Main() {
  const main = document.getElementById('q-main-area');
  if (!main) return;

  const totalDots = 8; // 0=stability, 1-6=questions, 7=verdict
  const dots = Array.from({ length: totalDots }, (_, i) => {
    let cls = 'q-dot';
    if (i < S.subStep) cls += ' done';
    else if (i === S.subStep) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');

  const progressBar = `<div class="q-progress">${dots}<span style="font-size:.68rem;color:var(--muted);margin-left:.5rem">${S.subStep < 7 ? `Step ${S.subStep + 1} of 7` : 'Analysis complete'}</span></div>`;

  if (S.subStep === 0) {
    renderStabilityQ(main, progressBar);
  } else if (S.subStep >= 1 && S.subStep <= 6) {
    renderSingleQ(main, progressBar, S.subStep);
  } else {
    renderVerdict(main, progressBar);
  }
}

function renderStabilityQ(main, progressBar) {
  const covariates = varNodes().filter(n => n.type !== 'target');
  const shiftAffected = new Set(shiftVars().flatMap(sv => sv.affects));

  // Also propagate: if a node is directly affected, and it points to other nodes, those might be unstable too
  const propagated = new Set(shiftAffected);
  let changed = true;
  while (changed) {
    changed = false;
    S.edges.forEach(e => {
      if (propagated.has(e.from) && !propagated.has(e.to)) {
        const dst = S.nodes.find(n => n.id === e.to);
        if (dst && dst.type !== 'target') { propagated.add(e.to); changed = true; }
      }
    });
  }

  const rows = covariates.map(n => {
    const directShift = shiftAffected.has(n.id);
    const indirectShift = propagated.has(n.id) && !directShift;
    let hint = '';
    if (directShift) {
      const svNames = shiftVars().filter(sv => sv.affects.includes(n.id)).map(sv => sv.name).join(', ');
      hint = `Directly affected by: <strong>${svNames}</strong>`;
    } else if (indirectShift) {
      hint = 'Downstream of an affected variable — may be unstable.';
    } else if (shiftVars().length > 0) {
      hint = 'No direct shift connection — likely stable.';
    } else {
      hint = 'No shift variables defined.';
    }

    const curVal = S.stableMap[n.id];
    // Initialize if null
    if (curVal === null) S.stableMap[n.id] = !(directShift || indirectShift);

    const isStable = S.stableMap[n.id];
    return `<div class="stab-row" id="stabrow-${n.id}">
      <span class="stab-name">${escHtml(n.name)} <span class="tag tag-${n.type === 'latent' ? 'lat' : 'obs'}" style="font-size:.6rem">${n.type === 'latent' ? 'Latent' : 'Observed'}</span></span>
      <span class="stab-hint">${hint}</span>
      <div class="stab-toggle">
        <button class="stab-btn ${isStable ? 's-stable' : ''}" onclick="setStable(${n.id},true)">Stable</button>
        <button class="stab-btn ${!isStable ? 's-unstable' : ''}" onclick="setStable(${n.id},false)">Unstable</button>
      </div>
    </div>`;
  });

  main.innerHTML = `${progressBar}
  <div class="q-card">
    <div class="q-label">Stability Classification</div>
    <div class="q-text">Which variables have a <em>stable</em> relationship with the prediction target across deployment environments?</div>
    <div class="q-hint">A relationship is <strong>stable</strong> if it remains consistent across different deployment environments (hospitals, time periods, etc.). Shift variables in your graph suggest potential instability. You can override any pre-suggestion below.</div>
    ${covariates.length === 0
      ? '<div class="banner banner-warn">No non-target variables defined. Go back to Step I to add covariates.</div>'
      : `<div class="stab-table">${rows.join('')}</div>`
    }
    <div style="margin-top:1rem;display:flex;justify-content:flex-end">
      <button class="btn btn-c3" onclick="advanceSubStep()">Next Question →</button>
    </div>
  </div>`;
}

function setStable(nodeId, isStable) {
  S.stableMap[nodeId] = isStable;
  renderQ3Main();
  renderQ3Side();
}

const QUESTIONS = [
  {
    key: 'canAdapt',
    label: 'Operational Constraints',
    text: 'Can the model access and use data from the deployment environment to adapt itself?',
    hint: 'This includes test-time adaptation, fine-tuning on deployment data, domain adaptation with unlabelled target data, or continual learning.',
    opts: [
      { val: 'yes', label: 'Yes — deployment data is accessible for adaptation' },
      { val: 'partial', label: 'Partially — limited access (e.g. only a small sample, no labels)' },
      { val: 'no', label: 'No — the model must be fixed at deployment time' },
    ],
  },
  {
    key: 'privacyOk',
    label: 'Privacy Constraints',
    text: 'Are there privacy or regulatory constraints on the use of deployment-site data?',
    hint: 'For example, GDPR restrictions, data governance policies, or clinical ethics requirements that prevent centralising or storing deployment data.',
    opts: [
      { val: 'no', label: 'No significant privacy constraints' },
      { val: 'yes', label: 'Yes — strict privacy/regulatory restrictions apply' },
    ],
  },
  {
    key: 'sufficientData',
    label: 'Data Availability',
    text: 'Is there sufficient training data to learn a robust predictive model?',
    hint: 'Consider whether you have enough labeled examples to train the model reliably. Small datasets limit which methods are feasible.',
    opts: [
      { val: 'yes', label: 'Yes — adequate training data is available' },
      { val: 'unsure', label: 'Uncertain — the dataset is small or may be insufficient' },
      { val: 'no', label: 'No — data is severely limited' },
    ],
  },
  {
    key: 'computeConstr',
    label: 'Computational Constraints',
    text: 'Are there strict constraints on inference speed, memory, or compute resources at deployment?',
    hint: 'Some robustness methods (e.g. ensembles, large neural networks) are computationally expensive. If deployment is on edge devices or in real-time clinical settings, this matters.',
    opts: [
      { val: 'no', label: 'No significant computational constraints' },
      { val: 'yes', label: 'Yes — strict speed, memory or compute limits apply' },
    ],
  },
  {
    key: 'canIsolate',
    label: 'Shift Isolation',
    text: 'For each shift variable you defined, can its effects be isolated or controlled using adjustment variables, proxies, or known environment indicators?',
    hint: 'Select one answer for each shift variable (for example Hospital, Scanner, or Time period). If a shift variable is not observable, choose “No”.',
    opts: [
      { val: 'yes', label: 'Yes — the shift can be identified or controlled' },
      { val: 'unsure', label: 'Possibly — some proxy information is available' },
      { val: 'no', label: 'No — the shift is unknown or unobservable' },
    ],
  },
  {
    key: 'canPreprocess',
    label: 'Preprocessing Options',
    text: 'Are there data preprocessing techniques that can reduce the influence of the anticipated shifts?',
    hint: 'Examples include: site-specific normalisation, artifact removal (e.g. scanner harmonisation), de-referencing for signal drift, or known calibration procedures.',
    opts: [
      { val: 'yes', label: 'Yes — specific preprocessing steps are known and applicable' },
      { val: 'unsure', label: 'Possibly — some preprocessing might help but is uncertain' },
      { val: 'no', label: 'No — no applicable preprocessing is known' },
    ],
  },
];

function getCanIsolateSummary() {
  const entries = Object.values(S.answers.canIsolateByShift || {});
  if (entries.length === 0) {
    return S.answers.canIsolate ?? null;
  }
  if (entries.some(v => v === 'yes')) return 'yes';
  if (entries.some(v => v === 'unsure')) return 'unsure';
  return 'no';
}

function renderShiftIsolationQ(main, progressBar, q, subStep) {
  const svList = shiftVars();
  const allAnswered = svList.length === 0 || svList.every(sv => S.answers.canIsolateByShift?.[sv.id] !== undefined && S.answers.canIsolateByShift?.[sv.id] !== null);
  const itemsHtml = svList.length > 0
    ? svList.map(sv => {
        const curVal = S.answers.canIsolateByShift?.[sv.id];
        return `<div class="card" style="margin-bottom:.7rem;padding:1rem">
          <div style="font-size:.8rem;font-weight:700;margin-bottom:.45rem">${escHtml(sv.name)}</div>
          <div class="q-hint" style="margin-bottom:.7rem">How well can the effects of this shift be isolated or controlled?</div>
          <div class="ans-opts">
            ${q.opts.map(o => `
              <div class="ans-opt ${curVal === o.val ? 'sel' : ''}" onclick="selectShiftIsolationAnswer(${sv.id}, '${o.val}')">
                <div class="ans-radio"></div>
                <span>${o.label}</span>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')
    : '<div class="banner banner-warn">No shift variables are defined yet. Add them in Step I to assess isolation for each one.</div>';

  main.innerHTML = `${progressBar}
  <div class="q-card">
    <div class="q-label">${q.label}</div>
    <div class="q-text">${q.text}</div>
    <div class="q-hint">${q.hint}</div>
    ${itemsHtml}
    <div style="margin-top:1rem;display:flex;justify-content:space-between">
      <button class="btn btn-ghost btn-sm" onclick="retreatSubStep()">← Previous</button>
      <button class="btn btn-c3" onclick="advanceSubStep()" ${allAnswered ? '' : 'disabled'}>
        ${subStep < 6 ? 'Next Question →' : 'See Feasibility Result →'}
      </button>
    </div>
  </div>`;
}

function renderSingleQ(main, progressBar, subStep) {
  const q = QUESTIONS[subStep - 1];
  if (q.key === 'canIsolate') {
    renderShiftIsolationQ(main, progressBar, q, subStep);
    return;
  }

  const curVal = S.answers[q.key];

  main.innerHTML = `${progressBar}
  <div class="q-card">
    <div class="q-label">${q.label}</div>
    <div class="q-text">${q.text}</div>
    <div class="q-hint">${q.hint}</div>
    <div class="ans-opts">
      ${q.opts.map(o => `
        <div class="ans-opt ${curVal === o.val ? 'sel' : ''}" onclick="selectAnswer('${q.key}','${o.val}')">
          <div class="ans-radio"></div>
          <span>${o.label}</span>
        </div>`).join('')}
    </div>
    <div style="margin-top:1rem;display:flex;justify-content:space-between">
      <button class="btn btn-ghost btn-sm" onclick="retreatSubStep()">← Previous</button>
      <button class="btn btn-c3" onclick="advanceSubStep()" ${curVal === null ? 'disabled' : ''}>
        ${subStep < 6 ? 'Next Question →' : 'See Feasibility Result →'}
      </button>
    </div>
  </div>`;
}

function selectAnswer(key, val) {
  S.answers[key] = val;
  renderQ3Main();
}

function selectShiftIsolationAnswer(svId, val) {
  S.answers.canIsolateByShift[svId] = val;
  S.answers.canIsolate = getCanIsolateSummary();
  renderQ3Main();
}

function advanceSubStep() {
  S.subStep = Math.min(7, S.subStep + 1);
  if (S.subStep === 7) computeVerdict();
  renderQ3Main();
  renderQ3Side();
}

function retreatSubStep() {
  S.subStep = Math.max(0, S.subStep - 1);
  renderQ3Main();
}

function computeVerdict() {
  const stableNodes = S.nodes.filter(n => n.type !== 'target' && S.stableMap[n.id] === true);
  const hasStable = stableNodes.length > 0;
  const canIsolateValue = getCanIsolateSummary();
  const canIsolate = canIsolateValue === 'yes' || canIsolateValue === 'unsure';
  const canPreprocess = S.answers.canPreprocess !== 'no';
  const sufficientData = S.answers.sufficientData !== 'no';
  const canAdapt = S.answers.canAdapt !== 'no';

  if (!hasStable && !canIsolate && !canPreprocess) {
    S.verdict = 'infeasible';
  } else if (hasStable && sufficientData && (canAdapt || canIsolate || canPreprocess)) {
    S.verdict = 'feasible';
  } else {
    S.verdict = 'caveats';
  }
}

function renderVerdict(main, progressBar) {
  const stableNodes = S.nodes.filter(n => n.type !== 'target' && S.stableMap[n.id] === true);
  const unstableNodes = S.nodes.filter(n => n.type !== 'target' && S.stableMap[n.id] === false);
  const latentNodes = S.nodes.filter(n => n.type === 'latent');

  let verdictHtml = '';
  if (S.verdict === 'feasible') {
    verdictHtml = `<div class="verdict v-feasible">
      <div class="v-title">✓ Problem is Feasible</div>
      <div class="v-body">
        Your problem description has sufficient structure to design a robust predictive model.
        ${stableNodes.length > 0 ? `You have <strong>${stableNodes.length} stable variable(s)</strong> (${stableNodes.map(n=>escHtml(n.name)).join(', ')}) that provide a reliable prediction baseline.` : ''}
        ${S.answers.canAdapt !== 'no' ? ' The model can adapt to the deployment environment, opening up domain adaptation strategies.' : ''}
        ${S.answers.canIsolate !== 'no' ? ' Shift effects can be partially isolated or controlled.' : ''}
        <br><br>Proceed to <strong>Step IV</strong> to see recommended deployment strategies for your problem.
      </div>
    </div>`;
  } else if (S.verdict === 'infeasible') {
    verdictHtml = `<div class="verdict v-infeasible">
      <div class="v-title">✗ Problem is Infeasible — Return to Step I</div>
      <div class="v-body">
        Based on your current problem description, no reliable mitigation strategy appears applicable:
        <ul>
          ${stableNodes.length === 0 ? '<li>No stable covariates identified — the model has no reliable signal that persists across environments.</li>' : ''}
          ${S.answers.canIsolate === 'no' ? '<li>The shift mechanism cannot be isolated or controlled.</li>' : ''}
          ${S.answers.canPreprocess === 'no' ? '<li>No preprocessing steps can reduce the shift influence.</li>' : ''}
        </ul>
        <br><strong>Suggested next steps — return to Step I and consider:</strong>
        <ul>
          <li>Adding additional variables that are causally upstream of the target and unaffected by shifts.</li>
          <li>Redesigning the prediction target to a quantity with more stable causal determinants.</li>
          <li>Re-examining your shift assumptions — are they all necessary, or can some be relaxed?</li>
          <li>Collecting proxy measurements for the shift mechanism to enable isolation strategies.</li>
          <li>Revisiting whether deployment really requires generalisation across these environments.</li>
        </ul>
      </div>
    </div>`;
  } else {
    verdictHtml = `<div class="verdict v-caveats">
      <div class="v-title">⚠ Problem is Feasible with Caveats</div>
      <div class="v-body">
        A solution may be possible, but with limitations:
        <ul>
          ${stableNodes.length === 0 ? '<li>No stable covariates — the model will rely entirely on mitigation strategies, with no guaranteed performance floor.</li>' : ''}
          ${S.answers.sufficientData === 'no' ? '<li>Limited data may prevent some methods (e.g. invariant learning, domain adaptation) from working reliably.</li>' : ''}
          ${S.answers.sufficientData === 'unsure' ? '<li>Data availability is uncertain — validate that methods requiring multiple environments or large samples are feasible.</li>' : ''}
          ${S.answers.canAdapt === 'no' && stableNodes.length < 2 ? '<li>Without adaptation and stable features, robustness is very limited.</li>' : ''}
        </ul>
        <br>Proceed to <strong>Step IV</strong> to review applicable strategies and their trade-offs for your problem.
      </div>
    </div>`;
  }

  main.innerHTML = `${progressBar}
  <div class="q-card">
    <div class="q-label">Feasibility Verdict</div>
    <div class="q-text">Based on your answers, here is the feasibility assessment:</div>
    ${verdictHtml}
    <div style="margin-top:1rem;display:flex;justify-content:space-between;align-items:center">
      <button class="btn btn-ghost btn-sm" onclick="retreatSubStep()">← Revise Answers</button>
      ${S.verdict === 'infeasible'
        ? `<button class="btn btn-c1" onclick="jumpToStep(0)">← Back to Problem Conceptualization</button>`
        : `<button class="btn btn-c4" onclick="navigate(1)">Proceed to Deployment Strategies →</button>`
      }
    </div>
  </div>`;
}

function jumpToStep(step) {
  S.step = step;
  S.subStep = 0;
  renderAll();
}

function renderStep3() {
  const p = document.getElementById('step3');
  const strats = computeStrategies();
  const target = S.nodes.find(n => n.type === 'target');
  const stableNodes = S.nodes.filter(n => S.stableMap[n.id] === true);

  p.innerHTML = `
<h2 class="sec-h">IV. Deployment Strategies</h2>
<p class="sec-p">Based on your causal description and feasibility analysis, the following strategies are recommended for your problem. These are not mutually exclusive — combining them often yields the best results.</p>

<div class="two-col" style="margin-bottom:1rem">
  <div class="card" style="border-left:4px solid var(--c3)">
    <div class="card-title">Problem Summary</div>
    <div style="font-size:.78rem;line-height:1.7">
      <div><strong>Target:</strong> ${target ? escHtml(target.name) : 'Not specified'}</div>
      <div><strong>Variables:</strong> ${varNodes().filter(n=>n.type!=='target').map(n=>escHtml(n.name)).join(', ') || 'None'}</div>
      <div><strong>Shift variables:</strong> ${shiftVars().map(sv=>escHtml(sv.name)).join(', ') || 'None defined'}</div>
      <div><strong>Stable covariates:</strong> ${stableNodes.map(n=>escHtml(n.name)).join(', ') || 'None identified'}</div>
    </div>
  </div>
  <div class="card" style="border-left:4px solid ${S.verdict==='feasible' ? 'var(--c3)' : S.verdict==='infeasible' ? 'var(--red)' : 'var(--amber)'}">
    <div class="card-title">Feasibility Verdict</div>
    <div style="font-size:.88rem;font-weight:700;margin-bottom:.3rem;color:${S.verdict==='feasible' ? '#166534' : S.verdict==='infeasible' ? '#991b1b' : '#854d0e'}">
      ${S.verdict==='feasible' ? '✓ Feasible' : S.verdict==='infeasible' ? '✗ Infeasible' : '⚠ Feasible with Caveats'}
    </div>
    <div style="font-size:.75rem;color:var(--muted);line-height:1.5">
      ${S.answers.canAdapt !== null ? `<div>Can adapt: <strong>${S.answers.canAdapt}</strong></div>` : ''}
      ${S.answers.canIsolate !== null || Object.keys(S.answers.canIsolateByShift || {}).length > 0 ? `<div>Can isolate shift: <strong>${getCanIsolateSummary() || 'not answered'}</strong></div>` : ''}
      ${S.answers.canPreprocess !== null ? `<div>Preprocessing available: <strong>${S.answers.canPreprocess}</strong></div>` : ''}
    </div>
  </div>
</div>

${strats.length === 0
  ? '<div class="banner banner-warn">No strategies applicable given the current feasibility analysis. Return to Step I to revise your problem definition.</div>'
  : `<div class="strat-grid">${strats.map(s => `
    <div class="strat-card">
      <div class="strat-name">${s.name}</div>
      <div class="strat-why">${s.why}</div>
      <div class="strat-desc">${s.desc}</div>
    </div>`).join('')}</div>`
}

<div style="margin-top:1.5rem">
  <div class="banner banner-info">
    <strong>Note:</strong> These recommendations are based on your causal description and the answers you provided. Model design is iterative — empirically evaluating multiple strategies and comparing them in validation studies is recommended. See Butler et al. (2026) for further guidance.
  </div>
</div>`;
}

function computeStrategies() {
  const strats = [];
  const stableNodes = S.nodes.filter(n => n.type !== 'target' && S.stableMap[n.id] === true);
  const unstableNodes = S.nodes.filter(n => n.type !== 'target' && S.stableMap[n.id] === false);
  const latentNodes = S.nodes.filter(n => n.type === 'latent');
  const hasLatent = latentNodes.length > 0;
  const hasShifts = shiftVars().length > 0;
  const target = S.nodes.find(n => n.type === 'target');

  const canAdapt = S.answers.canAdapt !== 'no';
  const noPrivacy = S.answers.privacyOk === 'no'; // 'no' = no constraints = good
  const sufficientData = S.answers.sufficientData !== 'no';
  const computeOk = S.answers.computeConstr !== 'yes';
  const canIsolateAnswer = getCanIsolateSummary();
  const canIsolate = canIsolateAnswer === 'yes' || canIsolateAnswer === 'unsure';
  const canPreprocess = S.answers.canPreprocess !== 'no';

  if (stableNodes.length > 0) {
    strats.push({
      name: 'Stable Feature Selection',
      why: `Applicable because you identified ${stableNodes.length} stable covariate(s): ${stableNodes.map(n=>n.name).join(', ')}.`,
      desc: 'Build your model using only stable features — those whose relationship with the target is preserved across environments. This gives a performance lower bound regardless of shifts. Even if unstable features improve in-distribution performance, they may harm deployment performance.',
    });
  }

  if (unstableNodes.length > 0 && stableNodes.length > 0 && sufficientData) {
    strats.push({
      name: 'Invariant Risk Minimization (IRM)',
      why: 'Applicable because you have both stable and unstable features and sufficient training data.',
      desc: 'IRM learns a feature representation that achieves an optimal stable predictor across all training environments simultaneously. It explicitly penalises reliance on unstable spurious correlations. Requires data from multiple training environments.',
    });
  }

  if (canAdapt && sufficientData) {
    if (noPrivacy) {
      strats.push({
        name: 'Domain Adaptation',
        why: 'Applicable because the model can access deployment data and no significant privacy constraints apply.',
        desc: 'Use unlabelled or labelled data from the deployment environment to adapt model parameters or reweight training samples. Approaches include importance weighting (IPW), adversarial domain adaptation, and domain-invariant representation learning.',
      });
    } else {
      strats.push({
        name: 'Privacy-Preserving Adaptation',
        why: 'Applicable because adaptation is possible but privacy constraints restrict centralising deployment data.',
        desc: 'Federated learning or differential privacy techniques allow models to adapt to deployment data without centralising sensitive records. The model updates can be aggregated from local sites while preserving patient privacy.',
      });
    }
  }

  if (canIsolate) {
    strats.push({
      name: 'Adjustment Sets / Inverse Probability Weighting',
      why: 'Applicable because you indicated that the shift mechanism can be observed or estimated.',
      desc: 'If you can observe the shift variable (e.g. hospital ID, scanner type) or estimate a propensity score for environment membership, inverse probability weighting (IPW) can rebalance the training distribution to resemble the target domain. This "undoes" selection and covariate shifts.',
    });
  }

  if (hasLatent && canIsolate) {
    strats.push({
      name: 'Proxy Methods for Latent Variables',
      why: `Applicable because your graph contains latent (unobserved) variables (${latentNodes.map(n=>n.name).join(', ')}) and proxy information is available.`,
      desc: 'When latent confounders exist, proxy variables — imperfect but correlated measurements — can be used to recover causal relationships. This allows adjustment for confounding even when the confounder itself is not directly observed.',
    });
  }

  if (canPreprocess) {
    strats.push({
      name: 'Data Preprocessing to Remove Shift Effects',
      why: 'Applicable because preprocessing steps to reduce shift influence are available.',
      desc: 'Apply site-specific normalisation, artifact removal, denoising, or calibration to training and deployment data before model training. Examples: ComBat harmonisation for neuroimaging, de-referencing for wandering EEG signals, or standardising measurement protocols.',
    });
  }

  if ((S.structAssump || S.funcAssump) && sufficientData) {
    strats.push({
      name: 'Causally Robust Optimization',
      why: 'Applicable because you specified structural or functional assumptions about the data-generating process.',
      desc: 'When the form of the causal mechanisms is known (e.g. linear relationships, additive noise), these structural constraints can be incorporated into the training objective. This yields estimators that remain valid under the specified class of shifts.',
    });
  }

  if (hasShifts && sufficientData && computeOk) {
    strats.push({
      name: 'Counterfactual Data Augmentation',
      why: 'Applicable when you have specified shift variables and sufficient compute for data generation.',
      desc: 'Use the causal model to generate synthetic counterfactual training examples — what the data would look like under different shift conditions. This artificially diversifies the training distribution and can help models learn invariant representations without needing multi-site data.',
    });
  }

  return strats;
}

// ─────────────────────────────────────────────────────────────────────
// EVENT HANDLERS
// ─────────────────────────────────────────────────────────────────────
function doAddNode() {
  const name = document.getElementById('i-nname')?.value || '';
  const type = document.getElementById('i-ntype')?.value || 'observed';
  const err = addNode(name, type);
  const errEl = document.getElementById('node-err');
  if (errEl) errEl.textContent = err || '';
  if (!err) { const inp = document.getElementById('i-nname'); if (inp) { inp.value = ''; inp.focus(); } }
}

function showNodeErr(err) {
  const errEl = document.getElementById('node-err');
  if (errEl) errEl.textContent = err || '';
}

function doRenameNode(id, name) { showNodeErr(renameNode(id, name)); }
function doSetNodeType(id, type) { showNodeErr(setNodeType(id, type)); }

function doAddEdge() {
  const fromId = parseInt(document.getElementById('i-efrom')?.value);
  const toId = parseInt(document.getElementById('i-eto')?.value);
  if (!fromId || !toId) return;
  const err = addEdge(fromId, toId);
  const errEl = document.getElementById('edge-err');
  if (errEl) errEl.textContent = err || '';
}

// ─────────────────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────────────────
function navigate(dir) {
  // Within Step III, use subStep navigation
  if (S.step === 2 && dir === 1) {
    if (S.subStep < 7) { advanceSubStep(); return; }
    // subStep === 7 (verdict) — advance to Step IV only if feasible/caveats
    if (S.verdict === 'infeasible') {
      setNavErr('Problem is infeasible. Revise your answers or return to Step I.');
      return;
    }
  }
  if (S.step === 2 && dir === -1) {
    if (S.subStep > 0) { retreatSubStep(); return; }
  }

  const err = validateStep(S.step, dir);
  if (err) { setNavErr(err); return; }
  setNavErr('');

  S.step = Math.max(0, Math.min(3, S.step + dir));
  S.selected = null;
  if (S.step === 2) { S.subStep = 0; initStableMap(); }
  renderAll();
  window.scrollTo(0, 0);
}

function initStableMap() {
  const shiftAffected = new Set(shiftVars().flatMap(sv => sv.affects));
  // Propagate
  const propagated = new Set(shiftAffected);
  let changed = true;
  while (changed) {
    changed = false;
    S.edges.forEach(e => {
      if (propagated.has(e.from) && !propagated.has(e.to)) {
        const dst = S.nodes.find(n => n.id === e.to);
        if (dst && dst.type !== 'target') { propagated.add(e.to); changed = true; }
      }
    });
  }
  varNodes().forEach(n => {
    if (n.type !== 'target') {
      if (S.stableMap[n.id] === null || S.stableMap[n.id] === undefined) {
        S.stableMap[n.id] = !propagated.has(n.id);
      }
    }
  });
}

function validateStep(step, dir) {
  if (dir <= 0) return null; // Always can go back
  if (step === 0) {
    if (varNodes().length < 2) return 'Add at least 2 variables (excluding shift variables) before continuing.';
    if (!S.nodes.some(n => n.type === 'target')) return 'Mark one variable as the Prediction Target before continuing.';
  }
  if (step === 2) {
    if (S.verdict === null) return 'Complete the feasibility analysis before proceeding.';
    if (S.verdict === 'infeasible') return 'Problem is infeasible. Revise or return to Step I.';
  }
  return null;
}

function setNavErr(msg) {
  const el = document.getElementById('nav-err');
  if (el) el.textContent = msg;
}

// ─────────────────────────────────────────────────────────────────────
// RENDER ALL
// ─────────────────────────────────────────────────────────────────────
function renderAll() {
  // Update stepper
  const stepper = document.getElementById('stepper');
  const labels = [
    ['I', 'Problem Conceptualization'],
    ['II', 'Causal Description'],
    ['III', 'Feasibility Analysis'],
    ['IV', 'Deployment Strategies'],
  ];
  stepper.innerHTML = labels.map(([num, lbl], i) => {
    let cls = 'step-tab';
    if (i === S.step) cls += ' active';
    else if (i < S.step) cls += ' done';
    return `<div class="${cls}" data-s="${i}"><span class="snum">${num}</span>${lbl}</div>${i < 3 ? '<span class="step-sep">›</span>' : ''}`;
  }).join('');

  document.querySelector('main').classList.toggle('wide', S.step === 0);

  // Show/hide panels
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById('step' + i);
    if (el) el.className = 'step-panel' + (i === S.step ? ' active' : '');
  }

  // Render current step
  if (S.step === 0) renderStep0();
  else if (S.step === 1) renderStep1();
  else if (S.step === 2) renderStep2();
  else if (S.step === 3) renderStep3();

  // Update bottom nav
  const btnBack = document.getElementById('btn-back');
  const btnNext = document.getElementById('btn-next');
  const navHint = document.getElementById('nav-hint');

  btnBack.disabled = (S.step === 0 && S.subStep === 0);

  if (S.step === 3) {
    btnNext.style.display = 'none';
  } else {
    btnNext.style.display = '';
    const labels3 = ['Next: Causal Description →', 'Next: Feasibility Analysis →', 'Next Question →', ''];
    if (S.step === 2) {
      if (S.subStep < 7) btnNext.textContent = 'Next Question →';
      else if (S.verdict !== 'infeasible') btnNext.textContent = 'Deployment Strategies →';
      else btnNext.textContent = 'Next →';
    } else {
      btnNext.textContent = labels3[S.step];
    }
  }

  const hints = [
    'Build the causal graph: variables, shift variables and prediction target',
    'Record causal assumptions',
    `Feasibility analysis — question ${S.subStep + 1} of 8`,
    'Review recommended deployment strategies',
  ];
  navHint.textContent = hints[S.step];
  setNavErr('');
}

// ─────────────────────────────────────────────────────────────────────
// EXAMPLE
// ─────────────────────────────────────────────────────────────────────
function loadExample() {
  S.nodes = []; S.edges = []; S.nodePos = {}; S.stableMap = {}; S.view = {};
  S.answers.canIsolateByShift = {}; S.selected = null;
  nodeSeq = 0;

  // From Butler et al. 2026 — lung cancer screening example
  const ids = {};
  [['Age_SES', 'latent'], ['Smoking', 'observed'], ['Lung_Cancer', 'target'], ['Weight_Loss', 'observed'], ['Screening_Policy', 'shift']].forEach(([name, type]) => {
    const id = ++nodeSeq;
    ids[name] = id;
    S.nodes.push({ id, name, type });
    if (type !== 'shift') S.stableMap[id] = null;
  });

  S.edges = [
    { from: ids['Age_SES'],    to: ids['Smoking'] },
    { from: ids['Age_SES'],    to: ids['Lung_Cancer'] },
    { from: ids['Smoking'],    to: ids['Lung_Cancer'] },
    { from: ids['Lung_Cancer'],to: ids['Weight_Loss'] },
    { from: ids['Screening_Policy'], to: ids['Weight_Loss'] },
  ];
  S.stableMap[ids['Weight_Loss']] = false;

  // Place nodes on a 2-row x 3-column grid:
  // Row1: Age, (empty), Screening_Policy
  // Row2: Smoking, Lung_Cancer, Weight_Loss
  S.nodePos[ids['Age_SES']] = { x: 80, y: 70 };
  S.nodePos[ids['Smoking']] = { x: 80, y: 170 };
  S.nodePos[ids['Lung_Cancer']] = { x: 200, y: 170 };
  S.nodePos[ids['Weight_Loss']] = { x: 320, y: 170 };
  S.nodePos[ids['Screening_Policy']] = { x: 320, y: 70 };

  S.structAssump = 'Lung cancer risk is determined by smoking history and background factors (age, occupation, socio-economic status).';
  S.funcAssump = 'The screening policy shift affects the distribution of Weight_Loss (a downstream symptom) but does not change the causal mechanism from Smoking to Lung_Cancer.';

  // S.view was cleared, so each graph fits itself to the example on its next render
  renderAll();
}

// ─────────────────────────────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// INIT
// ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const svgId = ['dag0', 'dag1', 'dag2'][S.step];
  if (svgId) rerenderDAG(svgId);
});

renderAll();
