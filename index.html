<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Generalization Copilot</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c1:#ea580c; --c2:#2563eb; --c3:#16a34a; --c4:#7c3aed;
  --col-target:#b45309; --col-obs:#1d4ed8; --col-lat:#94a3b8; --col-shift:#1e293b;
  --bg:#f1f5f9; --surf:#fff; --border:#e2e8f0;
  --text:#0f172a; --muted:#64748b; --red:#ef4444; --green:#22c55e; --amber:#f59e0b;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;font-size:14px}

/* HEADER */
header{background:var(--surf);border-bottom:1px solid var(--border);padding:.75rem 1.5rem .5rem;flex-shrink:0;position:relative}
header h1{font-size:1rem;font-weight:800}
header .sub{font-size:.72rem;color:var(--muted);margin-top:1px}
.stepper{display:flex;align-items:stretch;margin-top:.85rem;overflow-x:auto}
.step-tab{display:flex;align-items:center;gap:.4rem;padding:.55rem 1.1rem;font-size:.72rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:default;transition:all .15s;user-select:none}
.step-tab .snum{width:19px;height:19px;border-radius:50%;background:#e2e8f0;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;flex-shrink:0;transition:all .15s}
.step-tab[data-s="0"].active{color:var(--c1);border-bottom-color:var(--c1)} .step-tab[data-s="0"].active .snum{background:var(--c1);color:#fff}
.step-tab[data-s="1"].active{color:var(--c2);border-bottom-color:var(--c2)} .step-tab[data-s="1"].active .snum{background:var(--c2);color:#fff}
.step-tab[data-s="2"].active{color:var(--c4);border-bottom-color:var(--c4)} .step-tab[data-s="2"].active .snum{background:var(--c4);color:#fff}
.step-tab.done .snum{background:#94a3b8;color:#fff}
.step-sep{color:#cbd5e1;padding:0 .1rem;align-self:center;font-size:1.1rem;flex-shrink:0}

/* header logo */
.chai-logo{position:absolute;right:1.25rem;top:0.6rem;height:36px;width:auto;object-fit:contain}

/* MAIN */
main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:1.5rem 1.25rem 5.5rem}
main.wide{max-width:1400px}
.step-panel{display:none} .step-panel.active{display:block}

/* CARDS */
.card{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.85rem}
.sec-h{font-size:1rem;font-weight:700;margin-bottom:.2rem}
.sec-p{font-size:.78rem;color:var(--muted);line-height:1.6;margin-bottom:1rem}

/* LAYOUT */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
@media(max-width:640px){.two-col,.three-col{grid-template-columns:1fr}}

/* FORMS */
.field{margin-bottom:.65rem}
.field label{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:.28rem;letter-spacing:.03em}
input[type=text],select,textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:.38rem .6rem;font-size:.82rem;font-family:inherit;color:var(--text);background:var(--surf);outline:none;transition:border-color .15s}
input[type=text]:focus,select:focus,textarea:focus{border-color:#94a3b8;box-shadow:0 0 0 2px rgba(148,163,184,.15)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.form-row{display:flex;gap:.5rem;align-items:flex-end}
.form-row .field{flex:1;margin-bottom:0}

/* BUTTONS */
.btn{cursor:pointer;border:none;border-radius:6px;padding:.38rem .9rem;font-size:.78rem;font-weight:700;white-space:nowrap;transition:filter .15s,opacity .15s;font-family:inherit}
.btn:hover{filter:brightness(.9)} .btn:disabled{opacity:.4;cursor:default;filter:none}
.btn-dark{background:#0f172a;color:#fff}
.btn-c1{background:var(--c1);color:#fff} .btn-c2{background:var(--c2);color:#fff}
.btn-c3{background:var(--c3);color:#fff} .btn-c4{background:var(--c4);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-del{background:transparent;border:1px solid #fecaca;color:#dc2626;font-size:.68rem;padding:.18rem .5rem}
.btn-sm{padding:.22rem .65rem;font-size:.72rem}
.btn-load{background:#f1f5f9;border:1px solid var(--border);color:var(--muted);font-size:.72rem}

/* ITEM LISTS */
.item-list{display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem;min-height:2rem}
.item-row{display:flex;align-items:center;gap:.5rem;padding:.32rem .65rem;border:1px solid var(--border);border-radius:6px;font-size:.8rem;background:#f8fafc}
.item-name{flex:1;font-weight:600}
.tag{font-size:.62rem;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase;white-space:nowrap}
.tag-target{background:#fef3c7;color:#92400e}
.tag-obs{background:#dbeafe;color:#1e40af}
.tag-lat{background:#f1f5f9;color:#475569;border:1px solid var(--border)}
.tag-shift{background:#1e293b;color:#f1f5f9}
.empty-hint{text-align:center;color:var(--muted);font-size:.75rem;font-style:italic;padding:.75rem .5rem}

/* DAG */
.dag-wrap{background:#f8fafc;border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;aspect-ratio:2/1;height:auto}
.dag-wrap svg{display:block;cursor:default}
.dag-legend{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.5rem;font-size:.68rem;color:var(--muted)}
.leg-item{display:flex;align-items:center;gap:4px}
.leg-circle{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg-sq{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.leg-dashed{width:10px;height:10px;border-radius:50%;border:2px dashed var(--muted);flex-shrink:0}
.dag-controls{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:170px;background:var(--surf);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(15,23,42,.12);padding:.3rem}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;border-radius:5px;padding:.4rem .6rem;font-size:.76rem;font-family:inherit;color:var(--text);cursor:pointer}
.menu button:hover{background:#f1f5f9}
.menu-sep{height:1px;background:var(--border);margin:.3rem 0}
.menu-head{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:.3rem .6rem .15rem}
.dag-status{font-size:.72rem;color:var(--muted);letter-spacing:.02em;text-align:right;line-height:1.4}
.dag-status.err{color:#dc2626;font-weight:600}
.mode-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.mode-toggle button{border:none;background:transparent;padding:.22rem .65rem;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.mode-toggle button.on{background:#0f172a;color:#fff}
.dag-wrap.annotating{border-color:#fcd34d;background:#fffdf5}
.note-subject{font-size:.85rem;font-weight:700;margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}

/* STAGE I GRAPH BUILDER */
.builder{display:grid;grid-template-columns:300px minmax(0,1fr);gap:1rem;align-items:start}
.builder-side .card{padding:1rem}
.builder-graph{position:sticky;top:1rem;display:flex;flex-direction:column;margin-bottom:0}
.builder-graph .dag-wrap{aspect-ratio:auto;height:calc(100vh - 360px);min-height:380px}
@media(max-width:900px){.builder{grid-template-columns:1fr} .builder-graph{position:static;order:-1}}
.item-row.sel{border-color:var(--c1);background:#fff7ed}
.inline-name{flex:1;min-width:0;border-color:transparent !important;background:transparent !important;font-weight:600;padding:.15rem .35rem !important}
.inline-name:hover,.inline-name:focus{border-color:var(--border) !important;background:var(--surf) !important}
.type-sel{width:auto !important;font-size:.62rem !important;font-weight:800;text-transform:uppercase;padding:2px 4px !important;border-radius:20px !important;cursor:pointer}

/* BANNERS */
.banner{border-radius:7px;padding:.6rem .85rem;font-size:.75rem;line-height:1.55;margin-bottom:.85rem}
.banner-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a}
.banner-warn{background:#fffbeb;border:1px solid #fde68a;color:#78350f}
.banner-danger{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.divider{height:1px;background:var(--border);margin:.85rem 0}

/* OPTIONAL PROBLEM DETAILS */
.q-layout{display:flex;gap:1rem}
.q-main{flex:1.2;min-width:0}
.q-side{width:240px;flex-shrink:0}
@media(max-width:680px){.q-layout{flex-direction:column} .q-side{width:100%}}

.q-progress{display:flex;gap:4px;margin-bottom:1rem;align-items:center}
.q-dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;transition:background .2s;flex-shrink:0}
.q-dot.done{background:#86efac} .q-dot.active{background:var(--c3);box-shadow:0 0 0 2px rgba(22,163,74,.25)}

.q-card{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
.q-label{font-size:.68rem;font-weight:800;color:var(--c3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.45rem}
.q-text{font-size:.95rem;font-weight:700;line-height:1.5;margin-bottom:.3rem}
.q-hint{font-size:.75rem;color:var(--muted);line-height:1.55;margin-bottom:1rem}

.ans-opts{display:flex;flex-direction:column;gap:.4rem}
.ans-opt{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-size:.82rem;font-weight:500}
.ans-opt:hover{border-color:#94a3b8;background:#f8fafc}
.ans-opt.sel{border-color:var(--c3);background:#f0fdf4;color:#166534}
.ans-radio{width:16px;height:16px;border:2px solid #cbd5e1;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ans-opt.sel .ans-radio{border-color:var(--c3);background:var(--c3)}
.ans-opt.sel .ans-radio::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}

.question-fieldset{border:0;min-width:0}
.question-fieldset legend{padding:0}
.ans-opt:focus-within{outline:2px solid var(--c2);outline-offset:2px}
.ans-opt input{accent-color:var(--c3);width:16px;height:16px;flex-shrink:0}
.causal-notes{margin-top:1rem}
.causal-notes summary{cursor:pointer;font-size:.82rem;font-weight:700}
.causal-notes[open] summary{margin-bottom:.8rem}

/* STRATEGY CARDS */
.strat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
@media(max-width:640px){.strat-grid{grid-template-columns:1fr}}
.strat-card{background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:1rem;border-left:4px solid var(--c4)}
.strat-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.07)}
.strat-name{font-size:.88rem;font-weight:700;margin-bottom:.3rem}
.strat-why{font-size:.72rem;color:var(--c4);margin-bottom:.6rem;line-height:1.55}
.strat-sets{margin:.3rem 0 0 1.2rem;padding:0}
.strat-field{font-size:.75rem;line-height:1.55;margin-top:.6rem}
.strat-method{font-size:.72rem;color:var(--muted);margin-bottom:.6rem}
.variable-ref{padding:.06em .35em;border:1px solid;border-radius:4px;font-weight:600;white-space:normal;overflow-wrap:anywhere;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.type-observed,.variable-ref-observed{background:#eff6ff !important;border-color:#bfdbfe !important;color:var(--col-obs)}
.type-target,.variable-ref-target{background:#fff7ed !important;border-color:#fdba74 !important;color:#9a3412}
.type-shift,.variable-ref-shift{background:var(--col-shift) !important;border-color:var(--col-shift) !important;color:#fff}
.type-latent,.variable-ref-latent{background:#f1f5f9 !important;border-color:#cbd5e1 !important;border-style:dashed;color:#475569}
.strat-why,.strat-field,.problem-summary .summary-val{line-height:1.8}
.question-fieldset .q-text,.question-fieldset .q-hint{line-height:1.8}
.nav-right{flex-wrap:wrap;justify-content:flex-end}
@media(max-width:640px){.bottom-nav{padding:.5rem}.bottom-nav .btn{font-size:.7rem;padding:.5rem}body{padding-bottom:3rem}}
.strat-desc{font-size:.75rem;color:var(--muted);line-height:1.55}

/* SUMMARY PANEL */
.problem-summary{margin-bottom:1rem;background:#f0fdf4;border-color:#bbf7d0;border-left:4px solid var(--c3)}
.problem-summary .card-title{color:#166534}
.summary-section{margin-bottom:.75rem}
.summary-title{font-size:.68rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.summary-val{font-size:.78rem;line-height:1.5}
.summary-tag{font-size:.65rem;padding:1px 6px;border-radius:12px;background:#f1f5f9;border:1px solid var(--border);color:var(--muted);margin:1px 2px;display:inline-block}
.summary-tag.tag-sv{background:#1e293b;color:#f1f5f9;border-color:#1e293b}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--border);padding:.7rem 1.5rem;display:flex;justify-content:space-between;align-items:center;z-index:100;gap:.75rem}
.nav-left,.nav-right{display:flex;gap:.5rem;align-items:center}
.err-toast{font-size:.73rem;color:#dc2626}

/* SAVE DIALOG */
dialog{margin:auto;border:1px solid var(--border);border-radius:10px;padding:1.25rem;width:min(380px,90vw);background:var(--surf);color:var(--text);box-shadow:0 10px 30px rgba(15,23,42,.2)}
dialog::backdrop{background:rgba(15,23,42,.35)}</style>
</head>
<body>

<header>
  <h1>Domain Generalization Copilot</h1>
  <div class="sub">A guided tool for designing predictive models robust to data shifts &mdash; based on Butler et al. (2026)</div>
  <a href="https://www.chai.ac.uk/" target="_blank" rel="noopener noreferrer">
    <img src="logo_chai.png" class="chai-logo" alt="CHAI logo">
  </a>
  <div class="stepper" id="stepper"></div>
</header>

<main>
  <div class="step-panel" id="step0"></div>
  <div class="step-panel" id="step1"></div>
  <div class="step-panel" id="step2"></div>
</main>

<input type="file" id="i-loadfile" accept=".json,application/json" style="display:none" onchange="loadGraphFile(this)">

<dialog id="save-dlg">
  <form onsubmit="event.preventDefault();confirmSave()">
    <div class="card-title">Save Graph</div>
    <div class="field"><label for="i-savename">File name</label><input type="text" id="i-savename" spellcheck="false"></div>
    <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:.85rem">
      <button type="button" class="btn btn-ghost btn-sm" onclick="this.closest('dialog').close()">Cancel</button>
      <button type="submit" class="btn btn-dark btn-sm">OK</button>
    </div>
  </form>
</dialog>

<dialog id="replace-dlg">
  <form onsubmit="event.preventDefault();confirmReplace()">
    <div class="card-title">Are you sure?</div>
    <p style="font-size:.82rem;line-height:1.55">This will replace the current graph. Any unsaved changes will be lost.</p>
    <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:.85rem">
      <button type="button" class="btn btn-ghost btn-sm" onclick="this.closest('dialog').close()">Cancel</button>
      <button type="submit" class="btn btn-dark btn-sm">OK</button>
    </div>
  </form>
</dialog>
<div class="bottom-nav">
  <div class="nav-left">
    <button class="btn btn-ghost" id="btn-back" onclick="navigate(-1)">&#8592; Back</button>
  </div>
  <div class="nav-right">
    <span class="err-toast" id="nav-err"></span>
    <button class="btn btn-c4" id="btn-preliminary" onclick="showStrategies()">View preliminary recommendations</button>
    <button class="btn btn-dark" id="btn-next" onclick="navigate(1)">Next &#8594;</button>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────
let nodeSeq = 0;

const S = {
  step: 0,    // 0=graph, 1=optional problem details, 2=strategies
  questionKey: null, // Stable key of the current conditional question
  strategyReturn: 0, // Where Back returns after opening strategies

  nodes: [],      // {id,name,type:'observed'|'latent'|'target'|'shift',note?}
  edges: [],      // {from,to,note?} — edges out of a shift node are shift edges

  structAssump: '',
  funcAssump: '',

  answers: emptyAnswers(),

  nodePos: {},    // nodeId → {x,y}
  dragKey: null,
  view: {},       // svgId → {x,y,scale}
  dagOpts: {},    // svgId → last render options
  selected: null, // nodeId highlighted as the source of a new edge (Stage I editor)
  graphMsg: '',   // transient error shown in the Stage I graph toolbar
  lastClick: null,// {key,t} for double-click detection
  mousePt: null,  // cursor in graph coordinates, for the pending-edge line
  annotate: false,// Stage I editor mode: false = edit the graph, true = annotate nodes/edges
  noteSel: null,  // item being annotated: {node:id} | {edge:[from,to]}
  file: { name: null }, // file name last loaded or saved (pre-fills the Save window)
};

const isShift = n => n.type === 'shift';
function varNodes() { return S.nodes.filter(n => !isShift(n)); }
function shiftVars() {
  return S.nodes.filter(isShift).map(n => ({ id: n.id, name: n.name, affects: S.edges.filter(e => e.from === n.id).map(e => e.to) }));
}

// ─────────────────────────────────────────────────────────────────────
// GRAPH OPERATIONS
// ─────────────────────────────────────────────────────────────────────
function nameTaken(name, exceptId) {
  return S.nodes.some(n => n.id !== exceptId && n.name.toLowerCase() === name.toLowerCase());
}

function genericName() {
  let i = 1;
  while (nameTaken('X' + i)) i++;
  return 'X' + i;
}

function emptyAnswers() {
  return {
    trainingEnvironments: null, deploymentData: null, worstGroup: null,
    localUpdate: null, inputRoles: {}, corrections: {}, augmentations: {}, coverage: null,
  };
}

function invalidateGraphAssessment(targetChanged = false) {
  // These answers describe specific inputs and a specific predictor set.
  // Keep shared data-access answers, but ask graph-specific questions again.
  if (targetChanged) S.answers = emptyAnswers();
  S.answers.inputRoles = {};
  S.answers.corrections = {};
  S.answers.augmentations = {};
  S.answers.coverage = null;
  S.questionKey = null;
}

// pos: optional {x,y} in graph coordinates; otherwise a free spot near the view centre
function addNode(name, type, pos) {
  name = name.trim();
  if (!name) return 'Node name is required.';
  if (nameTaken(name)) return 'A node with this name already exists.';
  if (type === 'target') S.nodes.forEach(n => { if (n.type === 'target') n.type = 'observed'; });
  const id = ++nodeSeq;
  S.nodes.push({ id, name, type });
  S.nodePos[id] = pos || findFreeSpot(viewCentre('dag0'));
  invalidateGraphAssessment(type === 'target');
  renderAll();
  return null;
}

function removeNode(id) {
  const targetChanged = S.nodes.some(n => n.id === id && n.type === 'target');
  S.nodes = S.nodes.filter(n => n.id !== id);
  S.edges = S.edges.filter(e => e.from !== id && e.to !== id);
  delete S.nodePos[id];
  if (S.selected === id) S.selected = null;
  invalidateGraphAssessment(targetChanged);
  renderAll();
}

function renameNode(id, name) {
  const nd = S.nodes.find(n => n.id === id);
  if (!nd) return null;
  name = name.trim();
  let err = null;
  if (!name) err = 'Node name is required.';
  else if (nameTaken(name, id)) err = 'A node with this name already exists.';
  else nd.name = name;
  renderAll();
  return err;
}

function setNodeType(id, type) {
  const nd = S.nodes.find(n => n.id === id);
  if (!nd || nd.type === type) return null;
  const targetChanged = nd.type === 'target' || type === 'target';
  if (type === 'shift' && S.edges.some(e => e.to === id)) {
    renderAll();
    return 'Shift variables cannot have incoming edges — remove them first.';
  }
  if (type === 'target') S.nodes.forEach(n => { if (n.type === 'target') n.type = 'observed'; });
  nd.type = type;
  invalidateGraphAssessment(targetChanged);
  renderAll();
  return null;
}

function addEdge(fromId, toId) {
  if (fromId === toId) return 'Source and target must be different.';
  if (isShift(S.nodes.find(n => n.id === toId) || {})) return 'Shift variables cannot have incoming edges.';
  if (S.edges.some(e => e.from === fromId && e.to === toId)) return 'This edge already exists.';
  if (pathExists(toId, fromId)) return 'This edge would create a cycle.';
  S.edges.push({ from: fromId, to: toId });
  invalidateGraphAssessment();
  renderAll();
  return null;
}

function removeEdge(from, to) {
  S.edges = S.edges.filter(e => !(e.from === from && e.to === to));
  invalidateGraphAssessment();
  renderAll();
}

function pathExists(start, end) {
  const vis = new Set(), q = [start];
  while (q.length) {
    const cur = q.shift();
    if (cur === end) return true;
    if (vis.has(cur)) continue;
    vis.add(cur);
    S.edges.forEach(e => { if (e.from === cur) q.push(e.to); });
  }
  return false;
}

// ─────────────────────────────────────────────────────────────────────
// LAYOUT
// ─────────────────────────────────────────────────────────────────────
function viewCentre(svgId) {
  const vb = document.getElementById(svgId)?.viewBox.baseVal;
  if (vb && vb.width) return { x: vb.x + vb.width / 2, y: vb.y + vb.height / 2 };
  return { x: 0, y: 0 };
}

function findFreeSpot(c) {
  const taken = Object.values(S.nodePos), MIN = 70;
  for (let r = 0; r < 600; r += 35) {
    const steps = r === 0 ? 1 : Math.ceil((2 * Math.PI * r) / 35);
    for (let k = 0; k < steps; k++) {
      const p = { x: c.x + r * Math.cos((2 * Math.PI * k) / steps), y: c.y + r * Math.sin((2 * Math.PI * k) / steps) };
      if (taken.every(q => Math.hypot(q.x - p.x, q.y - p.y) >= MIN)) return p;
    }
  }
  return { ...c };
}

// Layered (Sugiyama-style) layout in graph coordinates. Only nodes without a stored
// position are placed, so manual arrangements survive; Auto-layout clears them all.
// SLOT_GAP is the vertical room a node takes in its column; dummy slots (edges passing
// through a column) only need enough room to keep the edge clear of neighbouring nodes.
const LAYER_GAP = 120, SLOT_GAP = 70, DUMMY_GAP = 24;

function computeLayout() {
  const pos = {};
  if (S.nodes.length === 0) return pos;
  if (S.nodes.every(n => S.nodePos[n.id])) {
    S.nodes.forEach(n => pos[n.id] = S.nodePos[n.id]);
    return pos;
  }

  // 1. Longest-path layering of the ordinary variables. Variables with no edges at all
  //    are set aside and packed into a row underneath instead of lengthening a column.
  const connected = new Set(S.edges.flatMap(e => [e.from, e.to]));
  const loose = varNodes().filter(n => !connected.has(n.id));
  const vars = varNodes().filter(n => connected.has(n.id));
  const layerOf = {}, preds = {};
  vars.forEach(n => preds[n.id] = []);
  const varEdges = S.edges.filter(e => preds[e.from] !== undefined && preds[e.to] !== undefined);
  varEdges.forEach(e => preds[e.to].push(e.from));
  const depth = id => layerOf[id] ?? (layerOf[id] = preds[id].length ? 1 + Math.max(...preds[id].map(depth)) : 0);
  vars.forEach(n => depth(n.id));
  const nL = vars.length ? Math.max(...vars.map(n => layerOf[n.id])) + 1 : 0;

  // 2. Split edges that skip layers into chains of dummy slots, so that intermediate
  //    layers reserve room for the edge instead of placing a node on top of it
  const layers = Array.from({ length: nL }, () => []);
  vars.forEach(n => layers[layerOf[n.id]].push(n.id));
  const up = {}, down = {};
  const link = (a, b) => { (down[a] = down[a] || []).push(b); (up[b] = up[b] || []).push(a); };
  let dummySeq = 0;
  varEdges.forEach(e => {
    let prev = e.from;
    for (let l = layerOf[e.from] + 1; l < layerOf[e.to]; l++) {
      const d = 'd' + dummySeq++;
      layers[l].push(d);
      link(prev, d);
      prev = d;
    }
    link(prev, e.to);
  });

  // 3. Barycentre sweeps to reduce crossings
  const idx = {};
  const reindex = layer => layer.forEach((k, i) => idx[k] = i);
  layers.forEach(reindex);
  const bary = (k, nbrs) => nbrs && nbrs.length ? nbrs.reduce((a, b) => a + idx[b], 0) / nbrs.length : idx[k];
  for (let it = 0; it < 8; it++) {
    const downward = it % 2 === 0;
    const order = downward ? layers.map((_, i) => i) : layers.map((_, i) => nL - 1 - i);
    order.forEach(l => {
      const nb = downward ? up : down;
      const bc = Object.fromEntries(layers[l].map(k => [k, bary(k, nb[k])]));
      layers[l].sort((a, b) => bc[a] - bc[b]);
      reindex(layers[l]);
    });
  }

  // 4. Vertical coordinates: pull each slot towards its neighbours, keeping the
  //    layer order and a minimum gap between slots
  //    The pull is damped and each column is re-centred, so columns don't drift apart.
  const gap = (a, b) => ((typeof a === 'string' ? DUMMY_GAP : SLOT_GAP) + (typeof b === 'string' ? DUMMY_GAP : SLOT_GAP)) / 2;
  const pack = layer => {
    const got = [0];
    for (let i = 1; i < layer.length; i++) got[i] = got[i - 1] + gap(layer[i - 1], layer[i]);
    return got.map(v => v - got[got.length - 1] / 2);
  };
  const y = {};
  layers.forEach(layer => pack(layer).forEach((v, i) => y[layer[i]] = v));
  for (let it = 0; it < 4; it++) {
    layers.forEach(layer => {
      const want = layer.map(k => {
        const nb = [...(up[k] || []), ...(down[k] || [])];
        return nb.length ? 0.5 * y[k] + 0.5 * nb.reduce((a, b) => a + y[b], 0) / nb.length : y[k];
      });
      const got = [...want];
      for (let i = 1; i < got.length; i++) got[i] = Math.max(got[i], got[i - 1] + gap(layer[i - 1], layer[i]));
      const mid = (got[0] + got[got.length - 1]) / 2;
      layer.forEach((k, i) => y[k] = got[i] - mid);
    });
  }

  // 4b. Edges are drawn straight, so move any node lying close to an edge that skips
  //     over its column off that line (pushing its column neighbours along)
  const CLEAR = 36;
  const nudge = (layer, i, dy) => {
    y[layer[i]] += dy;
    for (let j = i + 1; j < layer.length; j++) y[layer[j]] = Math.max(y[layer[j]], y[layer[j - 1]] + gap(layer[j - 1], layer[j]));
    for (let j = i - 1; j >= 0; j--) y[layer[j]] = Math.min(y[layer[j]], y[layer[j + 1]] - gap(layer[j], layer[j + 1]));
  };
  for (let it = 0; it < 6; it++) {
    let moved = false;
    varEdges.forEach(e => {
      const l0 = layerOf[e.from], l1 = layerOf[e.to];
      for (let l = l0 + 1; l < l1; l++) {
        const lineY = y[e.from] + (y[e.to] - y[e.from]) * (l - l0) / (l1 - l0);
        layers[l].forEach((k, i) => {
          if (typeof k === 'string') return;
          const d = y[k] - lineY;
          if (Math.abs(d) >= CLEAR) return;
          // move towards whichever side has more room in the column
          const roomUp = i === 0 ? Infinity : y[k] - y[layers[l][i - 1]];
          const roomDown = i === layers[l].length - 1 ? Infinity : y[layers[l][i + 1]] - y[k];
          const dir = d !== 0 ? Math.sign(d) : roomDown >= roomUp ? 1 : -1;
          nudge(layers[l], i, dir * (CLEAR - Math.abs(d)));
          moved = true;
        });
      }
    });
    if (!moved) break;
  }
  const auto = {};
  vars.forEach(n => auto[n.id] = { x: layerOf[n.id] * LAYER_GAP, y: y[n.id] });

  // 5. Variables without edges: a compact grid below everything else
  if (loose.length) {
    const ys = Object.values(auto).map(p => p.y);
    const bottom = ys.length ? Math.max(...ys) + SLOT_GAP : 0;
    const perRow = Math.max(4, nL + 1);
    loose.forEach((n, i) => auto[n.id] = { x: (i % perRow) * LAYER_GAP * 0.75, y: bottom + Math.floor(i / perRow) * SLOT_GAP });
  }

  // 6. Shift variables sit just above the nodes they affect, nudged sideways if the spot is taken
  const near = (p, list) => list.some(q => Math.hypot(q.x - p.x, q.y - p.y) < SLOT_GAP * 0.8);
  shiftVars().forEach(sv => {
    const kids = sv.affects.map(id => S.nodePos[id] || auto[id]).filter(Boolean);
    const all = Object.values(auto);
    const top = all.length ? Math.min(...all.map(p => p.y)) : 0;
    const base = kids.length
      ? { x: kids.reduce((a, p) => a + p.x, 0) / kids.length, y: Math.min(...kids.map(p => p.y)) - SLOT_GAP }
      : { x: -LAYER_GAP, y: top };
    let p = base;
    for (let k = 1; near(p, Object.values(auto)) && k < 20; k++) {
      p = { x: base.x + Math.ceil(k / 2) * (k % 2 ? 1 : -1) * LAYER_GAP / 2, y: base.y - (k > 8 ? SLOT_GAP : 0) };
    }
    auto[sv.id] = p;
  });

  S.nodes.forEach(n => {
    if (!S.nodePos[n.id]) S.nodePos[n.id] = auto[n.id] || findFreeSpot({ x: 0, y: 0 });
    pos[n.id] = S.nodePos[n.id];
  });
  return pos;
}

// Route an edge as a straight line, or as a quadratic curve if the straight line would
// pass through (or graze) another node. `bends` holds the bend directions of curves already
// routed at either endpoint, so sibling curves bow to opposite sides instead of overlapping.
// Returns { d: SVG path data, c: control point, bend: unit vector or null, pts: samples }.
function edgeRoute(s, d, startOff, endOff, obstacles, clearance, bends = []) {
  const dx = d.x - s.x, dy = d.y - s.y, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const sample = (cx, cy) => Array.from({ length: 23 }, (_, k) => {
    const t = (k + 1) / 24, a = (1 - t) * (1 - t), b = 2 * t * (1 - t), c = t * t;
    return { x: a * s.x + b * cx + c * d.x, y: a * s.y + b * cy + c * d.y };
  });
  const hits = (cx, cy, cl = clearance) => sample(cx, cy).some(p => obstacles.some(o => Math.hypot(o.x - p.x, o.y - p.y) < cl));
  const mx = (s.x + d.x) / 2, my = (s.y + d.y) / 2;
  let cx = mx, cy = my, bend = null;
  if (hits(cx, cy)) {
    const blocker = obstacles.reduce((best, o) => {
      const dist = Math.abs((o.x - s.x) * nx + (o.y - s.y) * ny);
      return !best || dist < best.dist ? { o, dist } : best;
    }, null).o;
    const away = (blocker.x - s.x) * nx + (blocker.y - s.y) * ny > 0 ? -1 : 1;
    const crowd = sg => bends.reduce((m, v) => Math.max(m, v.x * nx * sg + v.y * ny * sg), -1);
    const sides = [away, -away].sort((p, q) => crowd(p) - crowd(q));
    let sgn = sides[0], mag = 80;
    // once bent, keep enough distance to clear the obstacles' labels too
    search: for (const m of [50, 80, 110, 140, 180, 230]) {
      for (const sg of sides) if (!hits(mx + nx * m * sg, my + ny * m * sg, clearance + 16)) { sgn = sg; mag = m; break search; }
    }
    // siblings on the same side get a wider arc so they don't sit on top of each other
    if (crowd(sgn) > 0.5) mag += 35;
    cx = mx + nx * mag * sgn; cy = my + ny * mag * sgn;
    bend = { x: nx * sgn, y: ny * sgn };
  }
  const u1 = Math.hypot(cx - s.x, cy - s.y) || 1, u2 = Math.hypot(d.x - cx, d.y - cy) || 1;
  const x1 = s.x + (cx - s.x) / u1 * startOff, y1 = s.y + (cy - s.y) / u1 * startOff;
  const x2 = d.x - (d.x - cx) / u2 * endOff, y2 = d.y - (d.y - cy) / u2 * endOff;
  return {
    d: bend ? `M${x1},${y1}Q${cx},${cy} ${x2},${y2}` : `M${x1},${y1}L${x2},${y2}`,
    c: { x: cx, y: cy }, bend, pts: sample(cx, cy),
  };
}

// ─────────────────────────────────────────────────────────────────────
// SVG
// ─────────────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function se(tag, a) {
  const el = document.createElementNS(NS, tag);
  if (a) Object.entries(a).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function svgPoint(svg, ev) {
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  return {
    x: (vb.x || 0) + (ev.clientX - r.left) * ((vb.width || r.width) / r.width),
    y: (vb.y || 0) + (ev.clientY - r.top) * ((vb.height || r.height) / r.height),
  };
}

// Re-render with the options the graph was last drawn with (used by drag/pan/zoom)
function rerenderDAG(svgId) { renderDAG(svgId, S.dagOpts[svgId] || {}); }

function renderDAG(svgId, opts = {}) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  S.dagOpts[svgId] = { ...opts, resetView: false };
  const wrap = svg.parentElement;
  const W = wrap.clientWidth || 460;
  const H = wrap.clientHeight || 260;
  svg.style.width = '100%';
  svg.style.height = '100%';
  svg.innerHTML = '';

  const { stableMap = {}, draggable = false, editable = false, resetView = false } = opts;
  const NR = 16, SQ = 14;
  // annotate mode: note icons, clickable edges and the highlighted item only show in the editor
  const annot = editable && S.annotate;
  const noteSelItem = annot ? noteItem() : null;

  if (!svg.__graphAttached) {
    svg.addEventListener('mousedown', ev => onSvgMouseDown(ev, svgId));
    svg.addEventListener('mousemove', ev => onSvgMouseMove(ev, svgId));
    svg.addEventListener('wheel', ev => onSvgWheel(ev, svgId), { passive: false });
    svg.__graphAttached = true;
  }

  const pos = computeLayout();
  if (!S.view[svgId] || resetView) setHomeView(svgId, pos, W, H);
  const view = S.view[svgId];
  const vbW = W / view.scale;
  const vbH = H / view.scale;
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${vbW} ${vbH}`);
  if (editable) updateGraphStatus(svgId);

  if (S.nodes.length === 0) {
    const t = se('text', { x: view.x + vbW / 2, y: view.y + vbH / 2, 'text-anchor': 'middle', 'dominant-baseline': 'central', fill: '#94a3b8', 'font-size': '12', 'font-style': 'italic', 'pointer-events': 'none' });
    t.textContent = editable ? 'Double-click anywhere to add a node' : 'Add nodes to preview the graph';
    svg.appendChild(t);
    return;
  }

  // Markers
  const defs = se('defs');
  [['arr', '#94a3b8'], ['sarr', '#475569'], ['parr', '#ea580c']].forEach(([id, fill]) => {
    const m = se('marker', { id: svgId + id, viewBox: '0 -5 10 10', refX: 8, refY: 0, markerWidth: 5, markerHeight: 5, orient: 'auto' });
    m.appendChild(se('path', { d: 'M0,-5L10,0L0,5', fill }));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  // Edges (dashed when they leave a shift variable)
  const byId = Object.fromEntries(S.nodes.map(n => [n.id, n]));
  const routes = [], bends = {}, edgeNotes = [];
  S.edges.forEach(e => {
    const s = pos[e.from], d = pos[e.to];
    if (!s || !d) return;
    const shift = isShift(byId[e.from] || {});
    const obstacles = S.nodes.filter(n => n.id !== e.from && n.id !== e.to).map(n => pos[n.id]).filter(Boolean);
    const route = edgeRoute(s, d, shift ? SQ + 3 : NR + 2, NR + 7, obstacles, NR + 8, [...(bends[e.from] || []), ...(bends[e.to] || [])]);
    if (route.bend) [e.from, e.to].forEach(id => (bends[id] = bends[id] || []).push(route.bend));
    routes.push({ e, route });
    const picked = noteSelItem === e;
    const path = se('path', {
      d: route.d,
      fill: 'none', stroke: picked ? '#ea580c' : shift ? '#475569' : '#94a3b8', 'stroke-width': picked ? 2.5 : 1.5,
      'marker-end': `url(#${svgId}${picked ? 'parr' : shift ? 'sarr' : 'arr'})`, opacity: picked ? 1 : shift ? .85 : .75,
    });
    if (shift) path.setAttribute('stroke-dasharray', '6,3');
    svg.appendChild(path);
    if (annot) {
      // wide invisible stroke so thin edges are easy to click
      const hit = se('path', { d: route.d, fill: 'none', stroke: 'transparent', 'stroke-width': 12, 'data-hit': 1 });
      hit.style.cursor = 'pointer';
      hit.addEventListener('click', () => openNote({ edge: [e.from, e.to] }));
      svg.appendChild(hit);
      if (hasNote(e)) {
        const c = route.bend ? route.c : { x: (s.x + d.x) / 2, y: (s.y + d.y) / 2 };
        edgeNotes.push({ e, x: 0.25 * s.x + 0.5 * c.x + 0.25 * d.x, y: 0.25 * s.y + 0.5 * c.y + 0.25 * d.y });
      }
    }
  });

  // Rubber-band edge from the selected node to the cursor
  const selPos = editable && S.selected !== null ? pos[S.selected] : null;
  if (selPos) {
    const m = S.mousePt || selPos;
    svg.appendChild(se('line', {
      id: svgId + '-pending', x1: selPos.x, y1: selPos.y, x2: m.x, y2: m.y,
      stroke: '#ea580c', 'stroke-width': 2, 'stroke-dasharray': '4,4',
      'marker-end': `url(#${svgId}parr)`, 'pointer-events': 'none',
    }));
  }

  // Nodes
  S.nodes.forEach(nd => {
    const p = pos[nd.id];
    if (!p) return;
    const g = se('g', { transform: `translate(${p.x},${p.y})` });
    const selected = (editable && S.selected === nd.id) || noteSelItem === nd;

    if (isShift(nd)) {
      if (selected) g.appendChild(se('rect', { x: -SQ - 6, y: -SQ - 6, width: (SQ + 6) * 2, height: (SQ + 6) * 2, rx: 6, fill: 'none', stroke: '#ea580c', 'stroke-width': 3 }));
      g.appendChild(se('rect', { x: -SQ, y: -SQ, width: SQ * 2, height: SQ * 2, fill: '#1e293b', rx: 3, stroke: '#fff', 'stroke-width': 1.5 }));
    } else {
      const stable = stableMap[nd.id];
      if (selected) g.appendChild(se('circle', { r: NR + 7, fill: 'none', stroke: '#ea580c', 'stroke-width': 3 }));
      else if (stable === true) g.appendChild(se('circle', { r: NR + 5, fill: 'none', stroke: '#4ade80', 'stroke-width': 2, opacity: .85 }));
      else if (stable === false) g.appendChild(se('circle', { r: NR + 5, fill: 'none', stroke: '#f87171', 'stroke-width': 2.5, 'stroke-dasharray': '4,3', opacity: .9 }));

      let fill, stroke, dash = '';
      if (nd.type === 'target') { fill = '#b45309'; stroke = '#fff'; }
      else if (nd.type === 'latent') { fill = '#f8fafc'; stroke = '#94a3b8'; dash = '5,3'; }
      else { fill = '#1d4ed8'; stroke = '#fff'; }
      const c = se('circle', { r: NR, fill, stroke, 'stroke-width': 1.5 });
      if (dash) c.setAttribute('stroke-dasharray', dash);
      g.appendChild(c);
    }

    // Label sits outside the node on the side with the fewest edges, with a halo so it
    // stays legible if an edge does pass behind it
    const r = isShift(nd) ? SQ : NR;
    const side = labelSide(nd.id, pos, routes);
    const lbl = se('text', {
      x: side.x * (r + 6), y: side.y ? side.y * (r + 12) : 0,
      'text-anchor': side.x > 0 ? 'start' : side.x < 0 ? 'end' : 'middle', 'dominant-baseline': 'central',
      'font-size': '11', 'font-weight': '700', fill: '#0f172a',
      stroke: '#f8fafc', 'stroke-width': 3, 'stroke-linejoin': 'round', 'paint-order': 'stroke',
    });
    lbl.textContent = nd.name.length > 20 ? nd.name.slice(0, 19) + '…' : nd.name;
    const tt = se('title'); tt.textContent = nd.name + ({ latent: ' (latent)', target: ' (prediction target)', shift: ' (shift variable)' }[nd.type] || '');
    g.appendChild(tt); g.appendChild(lbl);
    if (annot && hasNote(nd)) g.appendChild(noteIcon(r + 1, -r - 1));

    if (draggable) { g.style.cursor = annot ? 'pointer' : 'grab'; g.addEventListener('mousedown', ev => startDrag(ev, nd.id, svgId)); }
    svg.appendChild(g);
  });

  // Edge note icons go on top of everything so nodes never hide them
  edgeNotes.forEach(({ e, x, y }) => {
    const icon = noteIcon(x, y);
    icon.setAttribute('data-hit', 1);
    icon.style.cursor = 'pointer';
    icon.addEventListener('click', () => openNote({ edge: [e.from, e.to] }));
    svg.appendChild(icon);
  });
}

// Small yellow "sticky note" square centred on (x, y), marking an item that has a note
function noteIcon(x, y) {
  return se('rect', { x: x - 4.5, y: y - 4.5, width: 9, height: 9, rx: 1.5, fill: '#fde047', stroke: '#a16207', 'stroke-width': 1 });
}

// Pick below / above / right / left for a node's label: whichever points furthest away from
// the node's own edges, any other edge passing close by, and neighbouring nodes (whose
// labels compete for the same gap). Ties go to "below".
const LABEL_SIDES = [{ x: 0, y: 1 }, { x: 0, y: -1 }, { x: 1, y: 0 }, { x: -1, y: 0 }];
function labelSide(id, pos, routes) {
  const p = pos[id];
  const unit = q => { const l = Math.hypot(q.x - p.x, q.y - p.y) || 1; return { x: (q.x - p.x) / l, y: (q.y - p.y) / l }; };
  const dirs = [];
  routes.forEach(({ e, route }) => {
    if (e.from === id || e.to === id) dirs.push(unit(route.bend ? route.c : pos[e.from === id ? e.to : e.from]));
    else route.pts.forEach(q => { if (Math.hypot(q.x - p.x, q.y - p.y) < 50) dirs.push(unit(q)); });
  });
  S.nodes.forEach(n => {
    const q = pos[n.id];
    if (n.id !== id && q && Math.hypot(q.x - p.x, q.y - p.y) < 80) dirs.push(unit(q));
  });
  if (!dirs.length) return LABEL_SIDES[0];
  let best = LABEL_SIDES[0], bestScore = Infinity;
  LABEL_SIDES.forEach((sd, i) => {
    // horizontal labels are wide, so they need more angular room than vertical ones
    const clash = Math.max(...dirs.map(d => sd.x * d.x + sd.y * d.y)) + (sd.x ? 0.35 : 0) + i * 0.01;
    if (clash < bestScore) { bestScore = clash; best = sd; }
  });
  return best;
}

// Mouse handling uses a small movement threshold so a click is never mistaken for a drag
// (a drag re-renders the SVG, which would otherwise swallow click / double-click detection).
const DRAG_THRESHOLD = 4;

function startDrag(ev, key, svgId) {
  if (ev.button !== 0) return;
  ev.preventDefault();
  const svg = document.getElementById(svgId);
  if (!svg) return;
  S.dragKey = key;
  const m0 = svgPoint(svg, ev);
  const cur = S.nodePos[key] || m0;
  const off = { dx: m0.x - cur.x, dy: m0.y - cur.y };
  const sx = ev.clientX, sy = ev.clientY;
  let moved = false;

  const onMove = e => {
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < DRAG_THRESHOLD) return;
    moved = true;
    const m = svgPoint(svg, e);
    S.nodePos[key] = { x: m.x - off.dx, y: m.y - off.dy };
    rerenderDAG(svgId);
  };
  const onUp = () => {
    S.dragKey = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (!moved && S.dagOpts[svgId]?.editable) onNodeClick(key, svgId);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function setHomeView(svgId, pos, W, H) {
  const view = { x: -W / 2, y: -H / 2, scale: 1 };
  const points = Object.values(pos);
  if (points.length > 0) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    points.forEach(p => {
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    });
    const pad = 70;
    const width = Math.max(1, maxX - minX + pad * 2);
    const height = Math.max(1, maxY - minY + pad * 2);
    const scale = Math.min(1.25,Math.max(0.25, Math.min(W / width, H / height)));
    // centre the bounding box in the viewport
    view.x = (minX + maxX) / 2 - W / scale / 2;
    view.y = (minY + maxY) / 2 - H / scale / 2;
    view.scale = scale;
  }
  S.view[svgId] = view;
}

function onSvgMouseDown(ev, svgId) {
  if (ev.button !== 0 || S.dragKey) return;
  if (ev.target.closest('g,[data-hit]')) return;
  const svg = document.getElementById(svgId);
  if (!svg) return;
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const clickPt = svgPoint(svg, ev);
  const source = {
    startX: ev.clientX,
    startY: ev.clientY,
    origX: S.view[svgId]?.x ?? 0,
    origY: S.view[svgId]?.y ?? 0,
    vbW: vb.width || r.width,
    vbH: vb.height || r.height,
    rW: r.width,
    rH: r.height,
  };
  let moved = false;

  const onMove = e => {
    if (!moved && Math.hypot(e.clientX - source.startX, e.clientY - source.startY) < DRAG_THRESHOLD) return;
    moved = true;
    const dx = (e.clientX - source.startX) * (source.vbW / source.rW);
    const dy = (e.clientY - source.startY) * (source.vbH / source.rH);
    S.view[svgId].x = source.origX - dx;
    S.view[svgId].y = source.origY - dy;
    rerenderDAG(svgId);
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (!moved && S.dagOpts[svgId]?.editable) onBackgroundClick(clickPt, svgId);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function onSvgMouseMove(ev, svgId) {
  if (S.selected === null || !S.dagOpts[svgId]?.editable) return;
  const svg = document.getElementById(svgId);
  if (!svg) return;
  S.mousePt = svgPoint(svg, ev);
  const ln = document.getElementById(svgId + '-pending');
  if (ln) { ln.setAttribute('x2', S.mousePt.x); ln.setAttribute('y2', S.mousePt.y); }
}

function onSvgWheel(ev, svgId) {
  ev.preventDefault();
  const svg = document.getElementById(svgId);
  if (!svg) return;
  const view = S.view[svgId] || { x: 0, y: 0, scale: 1 };
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const factor = ev.deltaY > 0 ? 0.88 : 1.12;
  const newScale = Math.max(0.25, Math.min(3, view.scale * factor));
  if (Math.abs(newScale - view.scale) < 0.0001) return;
  const x = ev.clientX - r.left;
  const y = ev.clientY - r.top;
  const viewX = view.x + x * (vb.width / r.width);
  const viewY = view.y + y * (vb.height / r.height);
  const newVbW = vb.width * (view.scale / newScale);
  const newVbH = vb.height * (view.scale / newScale);
  S.view[svgId] = {
    x: viewX - x * (newVbW / r.width),
    y: viewY - y * (newVbH / r.height),
    scale: newScale,
  };
  rerenderDAG(svgId);
}

function resetGraphView(svgId) {
  const svg = document.getElementById(svgId);
  if (!svg) return;
  S.view[svgId] = null;
  renderDAG(svgId, { ...S.dagOpts[svgId], resetView: true });
}

function autoLayout(svgId) {
  S.nodePos = {};
  resetGraphView(svgId);
}

function isDoubleClick(key) {
  const now = Date.now(), last = S.lastClick;
  const dbl = !!last && last.key === key && now - last.t < 400;
  S.lastClick = dbl ? null : { key, t: now };
  return dbl;
}

function onNodeClick(id, svgId) {
  S.graphMsg = '';
  if (S.annotate) { openNote({ node: id }); return; }
  if (isDoubleClick(id)) {
    S.selected = S.selected === id ? null : id;
    S.mousePt = null;
    syncSelection(svgId);
    return;
  }
  if (S.selected !== null && S.selected !== id) {
    const from = S.selected;
    S.selected = null;
    const err = addEdge(from, id);
    if (err) { S.graphMsg = err; syncSelection(svgId); }
  }
}

function onBackgroundClick(pt, svgId) {
  S.graphMsg = '';
  if (S.annotate) { if (S.noteSel) openNote(null); else rerenderDAG(svgId); return; }
  if (isDoubleClick('bg')) { S.selected = null; addNode(genericName(), 'observed', pt); return; }
  if (S.selected !== null) S.selected = null;
  syncSelection(svgId);
}

// Redraw the graph and the highlighted row in the node list without rebuilding the panel
function syncSelection(svgId) {
  document.querySelectorAll('#node-list .item-row').forEach(r => r.classList.toggle('sel', +r.dataset.id === S.selected));
  rerenderDAG(svgId);
}

function updateGraphStatus(svgId) {
  const el = document.getElementById(svgId + '-status');
  if (!el) return;
  const sel = S.nodes.find(n => n.id === S.selected);
  el.classList.toggle('err', !!S.graphMsg);
  if (S.graphMsg) el.textContent = S.graphMsg;
  else if (S.annotate) el.innerHTML = GRAPH_HELP.annotate;

}

const hasNote = item => !!item?.note?.trim();

function noteItem(sel = S.noteSel) {
  if (!sel) return null;
  if (sel.node !== undefined) return S.nodes.find(n => n.id === sel.node) || null;
  return S.edges.find(e => e.from === sel.edge[0] && e.to === sel.edge[1]) || null;
}

function setAnnotate(on) {
  if (S.annotate === on) return;
  S.annotate = on;
  S.selected = null; S.mousePt = null; S.graphMsg = ''; S.noteSel = null;
  renderStep0();
}

function openNote(sel) {
  S.noteSel = sel;
  const side = document.getElementById('builder-side');
  if (side) side.innerHTML = annotPanelHtml();
  rerenderDAG('dag0');
  document.getElementById('i-note')?.focus();
}

function setNote(text) {
  const item = noteItem();
  if (!item) return;
  const had = hasNote(item);
  item.note = text;
  if (had !== hasNote(item)) rerenderDAG('dag0'); // icon appears / disappears
}

function annotPanelHtml() {
  const item = noteItem();
  if (!item) return `<div class="card">
    <div class="card-title">Annotate</div>
    <div class="empty-hint">Click a node or edge in the graph to write a note about it, e.g. the assumptions behind adding it. Items with a note are marked with a yellow square.</div>
  </div>`;
  const isNode = S.noteSel.node !== undefined;
  const name = id => escHtml(S.nodes.find(n => n.id === id)?.name ?? '?');
  const subject = isNode
    ? `${escHtml(item.name)} <span class="tag type-${item.type}">${NODE_TYPES.find(t => t[0] === item.type)[2]}</span>`
    : `${name(item.from)} ${isShift(S.nodes.find(n => n.id === item.from) || {}) ? '⇢' : '→'} ${name(item.to)} <span class="tag tag-lat">Edge</span>`;
  return `<div class="card">
    <div class="card-title">Note</div>
    <div class="note-subject">${subject}</div>
    <div class="field"><textarea id="i-note" rows="10" placeholder="${isNode ? 'Why is this variable in the graph? What does it represent?' : 'Why does this edge exist? What causal assumption does it encode?'}" oninput="setNote(this.value)">${escHtml(item.note || '')}</textarea></div>
  </div>`;
}

document.addEventListener('keydown', ev => {
  if (S.step !== 0 || S.selected === null) return;
  if (ev.target.closest && ev.target.closest('input,select,textarea')) return;
  if (ev.key === 'Escape') { S.selected = null; S.graphMsg = ''; syncSelection('dag0'); }
  else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); removeNode(S.selected); }
});

// Optional questions: definitions are shared by rendering, answer validation,
// progress, and rule tests. A hidden follow-up cannot enable a strategy.
const YES_NO_UNKNOWN = [
  { value: 'yes', label: 'Yes' }, { value: 'no', label: 'No' },
  { value: 'unknown', label: 'Not known' },
];

function getQuestions(analysis = graphAnalysis()) {
  if (!S.nodes.some(n => n.type === 'observed')) return [];
  const questions = [{
    key: 'trainingEnvironments', title: 'Where do your labelled training data come from?',
    hint: 'An environment can be a hospital, scanner, population, or time period. The source environment is known when each record has a source name or code, such as Hospital A or Scanner 2. For example, data may come from several hospitals, but the hospital name or code was not stored with each record. In that case, the source environment is not recorded. This is separate from the prediction target label.',
    options: [
      { value: 'single', label: 'One environment' },
      { value: 'multiple_unknown', label: 'Several environments; the source environment is not recorded for each record' },
      { value: 'multiple_identified', label: 'Several environments; the source environment is recorded for each record' },
      { value: 'unknown', label: 'Not known' },
    ],
  }];
  if (S.answers.trainingEnvironments === 'multiple_identified') questions.push({
    key: 'worstGroup', title: 'Is performance in the weakest recorded environment a priority?',
    hint: 'This means giving more attention to the environment where the model makes the most errors.',
    options: YES_NO_UNKNOWN,
  });
  questions.push({
    key: 'deploymentData', title: 'What data from the intended deployment setting are available before use?',
    hint: 'Labelled data include the correct prediction target. Unlabelled data contain inputs only.',
    options: [
      { value: 'none', label: 'No deployment data' },
      { value: 'unlabelled', label: 'Unlabelled data' },
      { value: 'labelled', label: 'Labelled data' },
      { value: 'unknown', label: 'Not known' },
    ],
  });
  if (S.answers.deploymentData === 'labelled') questions.push({
    key: 'localUpdate', title: 'Can you update the model before deployment and test it on separate local data?',
    hint: 'Choose Yes only if updates are permitted and labelled local test data can be kept separate from data used for the update.',
    options: YES_NO_UNKNOWN,
  });
  analysis.shiftedInputs.forEach(n => {
    questions.push({
      key: `role:${n.id}`, ...variableText('title', 'What does ', n, ' represent in your inputs?'),
      hint: 'The graph shows that a data shift can affect this input. A cue is a part of an input, such as an image marking, that could be edited.',
      options: [
        { value: 'measurement', label: 'A measurement that might need correction' },
        { value: 'cue', label: 'An input cue that could be varied or removed' },
        { value: 'both', label: 'Both a measurement and an editable cue' },
        { value: 'other', label: 'Neither of these' },
        { value: 'unknown', label: 'Not known' },
      ],
    });
    const role = S.answers.inputRoles[n.id];
    if (role === 'measurement' || role === 'both') questions.push({
      key: `correction:${n.id}`, ...variableText('title', 'Is a suitable correction for ', n, ' known?'),
      hint: 'Choose Yes only if the procedure reduces the measurement difference, preserves information needed for prediction, and can be applied to training and deployment data where needed.',
      options: YES_NO_UNKNOWN,
    });
    if (role === 'cue' || role === 'both') questions.push({
      key: `augmentation:${n.id}`, ...variableText('title', 'Can you safely vary or remove ', n, ' in training inputs?'),
      hint: 'Choose Yes only if a known editing procedure preserves the correct target value and useful clinical information. This is an edit to recorded inputs, not a change to the patient.',
      options: YES_NO_UNKNOWN,
    });
  });
  if (analysis.weightingPredictors.length && ['unlabelled', 'labelled'].includes(S.answers.deploymentData)) questions.push({
    key: 'coverage', title: 'Do training data cover the input values expected at deployment?',
    ...variableText('hint', 'Check this for: ', ...variableListParts(analysis.weightingPredictors), '. Weighting cannot replace training examples for values or combinations that are absent.'),
    options: YES_NO_UNKNOWN,
  });
  return questions;
}

function getQuestionAnswer(key) {
  const [kind, id] = key.split(':');
  const field = { role: 'inputRoles', correction: 'corrections', augmentation: 'augmentations' }[kind];
  return field ? S.answers[field][id] ?? null : S.answers[key] ?? null;
}

function pruneAnswers() {
  // Discard answers to branches that no longer exist after a parent changes.
  if (S.answers.trainingEnvironments !== 'multiple_identified') S.answers.worstGroup = null;
  if (S.answers.deploymentData !== 'labelled') S.answers.localUpdate = null;
  const visible = new Set(getQuestions().map(q => q.key));
  for (const [kind, field] of Object.entries({ role: 'inputRoles', correction: 'corrections', augmentation: 'augmentations' })) {
    Object.keys(S.answers[field]).forEach(id => { if (!visible.has(`${kind}:${id}`)) delete S.answers[field][id]; });
  }
  if (!visible.has('coverage')) S.answers.coverage = null;
}

function selectAnswer(key, value) {
  const question = getQuestions().find(q => q.key === key);
  if (!question || !question.options.some(option => option.value === value)) return;
  const [kind, id] = key.split(':');
  const field = { role: 'inputRoles', correction: 'corrections', augmentation: 'augmentations' }[kind];
  if (kind === 'role' && S.answers.inputRoles[id] !== value) {
    delete S.answers.corrections[id]; delete S.answers.augmentations[id];
  }
  if (field) S.answers[field][id] = value;
  else S.answers[key] = value;
  S.questionKey = key;
  pruneAnswers();
  renderAll();
  // Keep keyboard focus on the selected answer after the question is rebuilt.
  document.getElementById(`answer-${key.replace(':', '-')}-${value}`)?.focus?.({ preventScroll: true });
}

function renderStep1() {
  const questions = getQuestions();
  let index = questions.findIndex(q => q.key === S.questionKey);
  if (index < 0) index = 0;
  const question = questions[index];
  S.questionKey = question?.key || null;
  const answered = questions.filter(q => getQuestionAnswer(q.key) !== null).length;
  const optionHtml = question ? question.options.map(option => `
    <label class="ans-opt ${getQuestionAnswer(question.key) === option.value ? 'sel' : ''}">
      <input id="answer-${question.key.replace(':', '-')}-${option.value}" type="radio" name="detail-answer" value="${option.value}" ${getQuestionAnswer(question.key) === option.value ? 'checked' : ''}
        onchange="selectAnswer('${question.key}','${option.value}')">
      <span>${escHtml(option.label)}</span>
    </label>`).join('') : '';
  document.getElementById('step1').innerHTML = `
<h2 class="sec-h">II. Problem Details</h2>
<p class="sec-p">Answer only the questions that apply to your graph. Select “Not known” if needed. You can view recommendations at any time.</p>
<div class="q-layout">
  <div class="q-main">
    <div class="q-card">
      ${question ? `
      <div class="q-label">Question ${index + 1} of ${questions.length}</div>
      <p class="q-hint">${answered} answered. Follow-up questions appear only when needed.</p>
      <fieldset class="question-fieldset">
        <legend class="q-text">${renderVariableText(question.titleParts || question.title)}</legend>
        <p class="q-hint">${renderVariableText(question.hintParts || question.hint)}</p>
        <div class="ans-opts">${optionHtml}</div>
      </fieldset>` : '<p class="q-text">No questions apply to the current graph.</p><p class="q-hint">Add observed inputs to explore more strategies.</p>'}
    </div>

function advanceDetailQuestion() {
  const questions = getQuestions();
  const index = questions.findIndex(q => q.key === S.questionKey);

function retreatDetailQuestion() {
  const questions = getQuestions();
  const index = questions.findIndex(q => q.key === S.questionKey);

  renderAll();
  window.scrollTo(0, 0);
}

  const err = validateStep(0, 1);
  if (err) { setNavErr(err); return; }
  S.step = 1;
  const questions = getQuestions();
  S.questionKey = (questions.find(q => getQuestionAnswer(q.key) === null) || questions[0])?.key || null;

}

// d-separation via the ancestral moral graph. Latent nodes remain in the graph;
// only observed nodes can be conditioned on as predictors. Conditioning can open
// collider paths, so descendant reachability is not a sufficient stability test.
function dSeparated(xs, ys, zs) {
  const conditioned = new Set(zs), targets = new Set(ys);
  const ancestors = new Set([...xs, ...ys, ...zs]);
  const queue = [...ancestors];
  for (let i = 0; i < queue.length; i++) {
    S.edges.forEach(e => {
      if (e.to === queue[i] && !ancestors.has(e.from)) {
        ancestors.add(e.from); queue.push(e.from);
      }
    });
  }
  const adj = new Map([...ancestors].map(id => [id, new Set()]));
  const link = (a, b) => { adj.get(a).add(b); adj.get(b).add(a); };
  ancestors.forEach(id => {
    const parents = S.edges.filter(e => e.to === id).map(e => e.from);
    parents.forEach(parent => link(parent, id));
    parents.forEach((a, i) => parents.slice(i + 1).forEach(b => link(a, b)));
  });
  const visited = new Set(conditioned), pending = [...xs];
  for (let i = 0; i < pending.length; i++) {
    const id = pending[i];
    if (targets.has(id)) return false;
    if (visited.has(id)) continue;
    visited.add(id);
    adj.get(id).forEach(next => { if (!visited.has(next)) pending.push(next); });
  }
  return true;
}

function separatesShifts(predictors) {
  const target = S.nodes.find(n => n.type === 'target');
  const shifts = shiftVars();
  if (!target || !shifts.length) return false;
  return dSeparated(shifts.map(n => n.id), [target.id], predictors);
}

function* combinations(items, k, start = 0) {
  if (!k) { yield []; return; }
  for (let i = start; i <= items.length - k; i++) {
    for (const rest of combinations(items, k - 1, i + 1)) yield [items[i], ...rest];
  }
}

const MAX_PREDICTOR_SETS = 4, MAX_SET_CHECKS = 1 << 15;

function graphAnalysis() {
  const observed = S.nodes.filter(n => n.type === 'observed');
  const target = S.nodes.find(n => n.type === 'target');
  const shifts = shiftVars();
  if (!target) return { predictorSets: [], shifts, shiftedInputs: [], weightingPredictors: [] };
  // Start with observed nodes connected to the target without traversing shifts.
  // Connectivity suggests a possible signal, not its strength or clinical utility.
  const connected = new Set([target.id]), pending = [target.id];
  for (let i = 0; i < pending.length; i++) {
    S.edges.forEach(e => {
      const other = e.from === pending[i] ? e.to : e.to === pending[i] ? e.from : null;
      if (other !== null && !connected.has(other) && !isShift(S.nodes.find(n => n.id === other))) {
        connected.add(other); pending.push(other);
      }
    });
  }
  const ids = observed.filter(n => connected.has(n.id)).map(n => n.id);
  // Stable sets are not closed under union, so several incomparable sets can
  // exist. A set is kept if it separates the target from every shift and each
  // member is informative given the rest. Searching from the largest size down
  // means every superset was checked first, so kept sets are maximal and never
  // subsets of each other. The search stops after a fixed number of checks.
  const sets = [];
  let checked = 0;
  if (shifts.length) {
    search: for (let k = ids.length; k > 0; k--) {
      for (const set of combinations(ids, k)) {
        if (sets.length === MAX_PREDICTOR_SETS || checked++ === MAX_SET_CHECKS) break search;
        if (sets.some(kept => set.every(id => kept.includes(id)))) continue;
        if (separatesShifts(set) && set.every(id => !dSeparated([id], [target.id], set.filter(o => o !== id)))) sets.push(set);
      }
    }
  }
  const predictorSets = sets.map(set => observed.filter(n => set.includes(n.id)));
  const shifted = new Set(shifts.map(n => n.id)), downstream = [...shifted];
  for (let i = 0; i < downstream.length; i++) {
    S.edges.forEach(e => {
      if (e.from === downstream[i] && !shifted.has(e.to)) { shifted.add(e.to); downstream.push(e.to); }
    });
  }
  return {
    predictorSets, shifts,
    shiftedInputs: observed.filter(n => connected.has(n.id) && shifted.has(n.id)),
    weightingPredictors: predictorSets.find(set => set.some(n => shifted.has(n.id))) || [],
  };
}

function variableBadge(nodeId) {
  const node = S.nodes.find(n => n.id === nodeId);
  if (!node) return 'Unknown variable';
  const label = NODE_TYPES.find(([type]) => type === node.type);
  if (!label) return escHtml(node.name);
  return `<span class="variable-ref variable-ref-${label[0]}" title="${escHtml(label[1])}" data-node-id="${node.id}">${escHtml(node.name)}</span>`;
}

function renderVariableText(parts) {
  if (!Array.isArray(parts)) return escHtml(parts);
  return parts.map(part => typeof part === 'string' ? escHtml(part) : variableBadge(part.nodeId)).join('');
}

function variableListParts(nodes) {
  return nodes.flatMap((node, i) => i ? [', ', node] : [node]);
}

function variableText(field, ...parts) {
  // Keep plain text for rule consumers, and explicit references for display.
  // Do not replace names in prose: a name can also be an ordinary word.
  return {
    [field]: parts.map(part => typeof part === 'string' ? part : part.name).join(''),
    [`${field}Parts`]: parts.map(part => typeof part === 'string' ? part : { nodeId: part.id }),
  };
}

// Card eligibility is explicit. No free-text note or unknown answer is positive
// evidence. Graph-only output is limited to the stable predictor candidate.
function computeStrategies(analysis = graphAnalysis()) {
  const cards = [], a = S.answers;
  const hasInputs = S.nodes.some(n => n.type === 'observed');
  const sets = analysis.predictorSets;
  if (sets.length) cards.push({
    id: 'stable-features', action: 'Test the candidate stable predictors', method: 'Stable feature selection',
    ...(sets.length === 1
      ? variableText('why', 'The graph supports a stable prediction relationship for this set: ', ...variableListParts(sets[0]), '.')
      : {
        // Plain `why` keeps every set for rule consumers; the display lists one set per line.
        why: variableText('why', 'The graph supports a stable prediction relationship for each of these sets: ',
          ...sets.flatMap((set, i) => [i ? ' or {' : '{', ...variableListParts(set), '}']),
          '. Combining sets may not be stable.').why,
        whyParts: ['The graph supports a stable prediction relationship for each of these sets. Combining sets may not be stable.'],
        whyList: sets.map(set => variableText('set', ...variableListParts(set)).setParts),
      }),
    check: sets.length === 1
      ? 'Confirm that these inputs are available when needed. Check data coverage and test prediction accuracy.'
      : 'Confirm that these inputs are available when needed. Check data coverage and compare prediction accuracy between the sets.',
    tradeoff: 'Removing other inputs can reduce accuracy. Stability alone does not ensure useful predictions.',
  });
  const corrected = analysis.shiftedInputs.filter(n => ['measurement', 'both'].includes(a.inputRoles[n.id]) && a.corrections[n.id] === 'yes');
  if (corrected.length) cards.push({
    id: 'measurement-correction', action: 'Correct the affected measurement', method: 'Measurement correction',
    ...variableText('why', 'A shift can affect ', ...variableListParts(corrected), '. You confirmed a suitable correction for these inputs.'),
    check: 'Test that the correction reduces the measurement difference and keeps useful information in each setting.',
    tradeoff: 'A correction can remove useful signal. Each setting may need a different procedure.',
  });
  const edited = analysis.shiftedInputs.filter(n => ['cue', 'both'].includes(a.inputRoles[n.id]) && a.augmentations[n.id] === 'yes');
  if (edited.length) cards.push({
    id: 'cue-augmentation', action: 'Vary or remove the unstable cue', method: 'Targeted data augmentation',
    ...variableText('why', 'A shift can affect ', ...variableListParts(edited), '. You confirmed that these cues can be edited safely in training inputs.'),
    check: 'Check that each edit keeps the correct target value and useful clinical information. Test on real data.',
    tradeoff: 'Edited inputs may differ from real inputs. Too much editing can remove useful signal.',
  });
  if (hasInputs && a.trainingEnvironments === 'multiple_identified' && a.worstGroup === 'yes') cards.push({
    id: 'group-dro', action: 'Protect performance across recorded environments', method: 'Group distributionally robust optimisation (Group DRO)',
    why: 'Your labelled data record the source environment for each record. You want to give priority to the weakest environment.',
    check: 'Check sample counts and test accuracy in each environment. Use separate data to set training options.',
    tradeoff: 'Average accuracy may decrease. This method does not ensure performance in new environments.',
  });
  if (analysis.weightingPredictors.length && ['unlabelled', 'labelled'].includes(a.deploymentData) && a.coverage === 'yes') cards.push({
    id: 'covariate-weighting', action: 'Reweight training examples for deployment', method: 'Covariate-shift weighting',
    ...variableText('why', 'For ', ...variableListParts(analysis.weightingPredictors), ', the graph supports a stable prediction relationship despite changing input distributions. You have deployment inputs and confirmed data coverage.'),
    check: 'Check that local inputs represent intended use. Estimate weights for this set. Check for large weights and test with separate data.',
    tradeoff: 'Large weights can make training unreliable. This method cannot correct changes in the target relationship.',
  });
  if (hasInputs && a.deploymentData === 'labelled' && a.localUpdate === 'yes') cards.push({
    id: 'local-update', action: 'Update using labelled local data', method: 'Supervised adaptation',
    why: 'You have labelled local data, permission to update, and separate local test data.',
    check: 'Confirm that the target has the same meaning. Compare the updated model with the original on local test data.',
    tradeoff: 'The update may fit the local sample too closely. Performance in other settings may decrease.',
  });
  return cards;
}

// ─────────────────────────────────────────────────────────────────────
function navigate(dir) {
  if (S.step === 2 && dir === -1) {
    S.step = S.strategyReturn;
    renderAll(); window.scrollTo(0, 0); return;
  }
  if (S.step === 1) {
    if (dir > 0) advanceDetailQuestion();
    else retreatDetailQuestion();
    return;
  }
  const err = validateStep(S.step, dir);
  if (err) { setNavErr(err); return; }
  if (dir > 0) startDetails();
}

function validateStep(step, dir) {
  if (dir <= 0) return null;
  if (step === 0) {
    if (varNodes().length < 2) return 'Add at least 2 variables (excluding shift variables) before continuing.';
    if (!S.nodes.some(n => n.type === 'target')) return 'Mark one variable as the Prediction Target before continuing.';
  }
  return null;
}

function setNavErr(msg) {
  const el = document.getElementById('nav-err');
  if (el) el.textContent = msg;
}

function renderAll() {
  // Update stepper
  const stepper = document.getElementById('stepper');
  const labels = [
    ['I', 'Graph Builder'],
    ['II', 'Problem Details'],
    ['III', 'Deployment Strategies'],
  ];
  stepper.innerHTML = labels.map(([num, lbl], i) => {
    let cls = 'step-tab';
    if (i === S.step) cls += ' active';
    return `<div class="${cls}" data-s="${i}"><span class="snum">${num}</span>${lbl}</div>${i < labels.length - 1 ? '<span class="step-sep">›</span>' : ''}`;
  }).join('');

  document.querySelector('main').classList.toggle('wide', S.step === 0);

  // Show/hide panels
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById('step' + i);
    if (el) el.className = 'step-panel' + (i === S.step ? ' active' : '');
  }

  // Render current step
  if (S.step === 0) renderStep0();
  else if (S.step === 1) renderStep1();
  else if (S.step === 2) renderStep2();

  // Update bottom nav
  const btnBack = document.getElementById('btn-back');
  const btnNext = document.getElementById('btn-next');

  btnBack.disabled = S.step === 0;

  const btnPreliminary = document.getElementById('btn-preliminary');
  btnPreliminary.hidden = S.step === 2;
  btnPreliminary.textContent = S.step === 0 ? 'View preliminary recommendations' : 'View recommendations';
  const questions = S.step === 1 ? getQuestions() : [];
  const index = questions.findIndex(q => q.key === S.questionKey);
  btnNext.style.display = S.step === 2 ? 'none' : '';
  btnNext.textContent = S.step === 0 ? 'Next: Problem Details →'
    : index === questions.length - 1 ? 'View recommendations →' : 'Next question →';

  setNavErr('');
}
